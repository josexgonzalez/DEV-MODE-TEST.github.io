<body>
    <h1>Fuerza Bruta de Syscalls - PS5</h1>
    <p>Exploit para probar syscalls en PS5 FW 10.20.</p>
    <button onclick="startBruteForce()">Iniciar Fuerza Bruta</button>
    <div id="log"></div>

    <script>
        let running = false;
        let logDiv = document.getElementById("log");

        function log(message) {
            let msgDiv = document.createElement("pre");
            msgDiv.textContent = message;
            logDiv.appendChild(msgDiv);
        }

        function syscall(number, arg1 = 0, arg2 = 0, arg3 = 0) {
            try {
                // Suponiendo que se está usando un método para hacer syscalls en PS5
                // Aquí usamos syscall(N) con los argumentos, como es común en los exploits
                let result = syscall_impl(number, arg1, arg2, arg3);
                return result;
            } catch (e) {
                return e.message;
            }
        }

        function bruteForceSyscalls(start, end) {
            if (!running) return;

            for (let syscallNum = start; syscallNum <= end; syscallNum++) {
                let result = syscall(syscallNum);
                if (result !== "ENOSYS") {
                    log(`syscall(${syscallNum}) -> ${result}`);
                }
                if (!running) break;
            }
        }

        function startBruteForce() {
            if (running) {
                log("Fuerza bruta ya está en ejecución.");
                return;
            }
            running = true;
            log("Iniciando fuerza bruta de syscalls...");

            let start = 10;  // Comienza en syscall(500)
            let end = 600000;    // Termina en syscall(600)

            bruteForceSyscalls(start, end);
        }

        function stopBruteForce() {
            running = false;
            log("Fuerza bruta detenida.");
        }

    </script>
