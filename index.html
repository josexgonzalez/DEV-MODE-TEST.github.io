<!DOCTYPE html>
<html>
<head>
  <title>PS5 WebKit Max Stress</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .boom {
      display: inline-block;
      margin: 1px;
      animation: scaleup 0.1s infinite alternate;
      will-change: transform;
      color: #0f0;
    }
    @keyframes scaleup {
      0% { transform: scale(1); }
      100% { transform: scale(3); }
    }
  </style>
</head>
<body>
  <pre id="log">[+] PS5 WebKit Max Stress Loaded...</pre>

  <script>
    const log = msg => {
      const el = document.getElementById("log");
      el.textContent += "\n" + msg;
      if (el.textContent.length > 10000) el.textContent = el.textContent.slice(-8000);
    };

    // String gigante para heap spray
    const bigStr = "💥".repeat(1000);

    // Arreglo para heap spray
    const spray = [];

    // Crear nodos con múltiples niveles de Shadow DOM anidados
    function createNestedShadow(host, depth) {
      if (depth === 0) return;
      const shadow = host.attachShadow({ mode: "open" });
      const wrapper = document.createElement("div");
      wrapper.style.display = "contents";
      for (let i = 0; i < 5; i++) {
        const span = document.createElement("span");
        span.textContent = `🔥Level${depth}-${i} ` + bigStr;
        wrapper.appendChild(span);
      }
      shadow.appendChild(wrapper);
      createNestedShadow(wrapper, depth - 1);
    }

    let frame = 0;
    function stressLoop() {
      try {
        // Heap spray con strings muy grandes
        for (let i = 0; i < 1000; i++) {
          spray.push(bigStr + frame + i);
        }

        // Crear muchos hosts con Shadow DOM anidados
        for (let i = 0; i < 50; i++) {
          const host = document.createElement("div");
          host.className = "boom";
          host.textContent = "💣" + frame + "_" + i;
          document.body.appendChild(host);
          createNestedShadow(host, 8); // 8 niveles anidados
        }

        // Destruir aleatoriamente nodos antiguos para forzar GC y memoria fragmentada
        if (document.body.children.length > 3000) {
          for (let i = 0; i < 500; i++) {
            const child = document.body.children[Math.floor(Math.random() * document.body.children.length)];
            if (child) child.remove();
          }
          log(`[+] Cleaned nodes at frame ${frame}`);
        }

        frame++;
        if (frame % 10 === 0) log(`[+] Frame ${frame} running...`);
      } catch (e) {
        log(`[!] Exception: ${e.message}`);
      }
      requestAnimationFrame(stressLoop);
    }

    setTimeout(() => {
      log("[+] Starting stress loop...");
      stressLoop();
    }, 100);
  </script>
</body>
</html>
