<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🔥 PS5 WebKit Crash Test</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Intentando crashear WebKit de PS5</h1>
  <p>Si ves esto por más de unos segundos, probablemente no ha crasheado aún.</p>

  <video id="myvideo" preload="auto" autoplay loop muted></video>

  <script>
    const video = document.getElementById("myvideo");

    function fuzzPoster() {
      try {
        for (let i = 0; i < 10000; i++) {
          // Genera una cadena malformada pseudo-aleatoria
          const garbage = "data:image/jpeg;base64," + btoa(unescape(encodeURIComponent(String.fromCharCode(
            ...Array.from({ length: 500 }, () => Math.floor(Math.random() * 255))
          ))));

          video.poster = garbage;

          // También cambiamos dinámicamente src para desestabilizar
          video.src = garbage;
          video.load();
        }
        document.body.innerHTML += "<p>✅ Fuzzing completado sin excepción.</p>";
      } catch (e) {
        document.body.innerHTML += `<p style="color:red;">❌ Error capturado: ${e}</p>`;
      }
    }

    window.onload = () => {
      setTimeout(fuzzPoster, 200); // Pequeña espera para asegurar carga inicial
    };
  </script>
</body>
</html>
