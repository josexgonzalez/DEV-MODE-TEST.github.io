<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PS5 10.20 TypedArray Memory Corruption Detector</title>
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    #log {
      margin-top: 20px;
      white-space: pre-wrap;
      max-height: 80vh;
      overflow-y: auto;
    }
    .fail { color: #f00; }
    .success { color: #0f0; }
    .info { color: #0af; }
  </style>
</head>
<body>
  <h1>PS5 10.20 TypedArray Memory Corruption Detector</h1>
  <div id="log"></div>

  <script>
    const logDiv = document.getElementById('log');

    function logOk(msg) {
      const e = document.createElement('div');
      e.className = 'success';
      e.textContent = '[OK] ' + msg;
      logDiv.appendChild(e);
    }

    function logFail(msg) {
      const e = document.createElement('div');
      e.className = 'fail';
      e.textContent = '[FAIL] ' + msg;
      logDiv.appendChild(e);
    }

    function logInfo(msg) {
      const e = document.createElement('div');
      e.className = 'info';
      e.textContent = '[INFO] ' + msg;
      logDiv.appendChild(e);
    }

    function hex(x) {
      return '0x' + x.toString(16);
    }

    function floatToUint64(f) {
      const buf = new ArrayBuffer(8);
      const f64 = new Float64Array(buf);
      const u32 = new Uint32Array(buf);
      f64[0] = f;
      return [u32[0], u32[1]];
    }

    function start() {
      logInfo('Iniciando Memory Corruption Detector...');

      const victimBuf = new ArrayBuffer(0x100);
      const attackerBuf = new ArrayBuffer(0x100);
      const float64 = new Float64Array(attackerBuf);

      logOk('Buffers creados.');

      // Fase de "ataque controlado" (simulado)
      for (let i = 0; i < float64.length; i++) {
        float64[i] = 1.1111111111111111e-308; // valor muy pequeño que en bits es casi 0
      }

      // Ahora intentamos simular corrupción: escribimos patrones ilegales
      float64[0] = 2.2250738585072014e-308; // patrón para alterar bajo nivel

      logInfo('Patrones de corrupción simulados.');

      // Ahora inspeccionamos si cambió la memoria
      const viewVictim = new Uint32Array(victimBuf);

      let corruptionDetected = false;
      for (let i = 0; i < viewVictim.length; i++) {
        if (viewVictim[i] !== 0) {
          logFail(`Corrupción detectada en víctima en offset ${i}: ${hex(viewVictim[i])}`);
          corruptionDetected = true;
          break;
        }
      }

      if (!corruptionDetected) {
        logOk('No se detectó corrupción en víctima.');
      }

      logInfo('Detector terminado.');
    }

    window.onload = start;
  </script>
</body>
</html>
