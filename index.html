<!DOCTYPE html>
<html>
<head>
  <title>GC Heap PS5 Test</title>
  <script>
    const log = msg => {
      console.log('[GC Test] ' + msg);
    };

    let collected = false;

    // Usamos FinalizationRegistry si está disponible
    if (typeof FinalizationRegistry === 'function' && typeof WeakRef === 'function') {
      const registry = new FinalizationRegistry((heldValue) => {
        collected = true;
        log('✅ Objeto recolectado por el GC: ' + heldValue);
      });

      function testGC() {
        let obj = { data: new Array(10000).fill(1337) }; // algo grande
        registry.register(obj, 'payload');
        const weak = new WeakRef(obj);
        obj = null;

        setTimeout(() => {
          if (weak.deref() === undefined) {
            log('⚠️ El objeto ya fue recolectado (deref undefined).');
          } else {
            log('⏳ Objeto aún en memoria.');
          }

          if (!collected) {
            log('❌ GC aún no activado o objeto no recolectado.');
          }
        }, 2000);
      }

      window.onload = () => {
        log('🚀 Ejecutando test GC...');
        testGC();
      };
    } else {
      log('❌ FinalizationRegistry o WeakRef no disponibles en este entorno.');
    }
  </script>
</head>
<body>
  <h1>PS5 GC Heap Test</h1>
</body>
</html>
