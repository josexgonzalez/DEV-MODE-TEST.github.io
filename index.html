<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Manipulación de Funciones en PS5</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .log {
      background-color: #f0f0f0;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      max-width: 600px;
      overflow-wrap: break-word;
    }
    .log span {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Manipulación Avanzada en PS5</h1>
  <div id="log"></div>

  <script>
    // Función de logging para mostrar los resultados
    function log(message) {
      const logContainer = document.getElementById("log");
      const newMessage = document.createElement("div");
      newMessage.classList.add("log");
      newMessage.textContent = message;
      logContainer.appendChild(newMessage);
    }

    // Sobrescribir XMLHttpRequest para monitorear peticiones
    const originalXMLHttpRequest = XMLHttpRequest;
    XMLHttpRequest = function() {
      const xhr = new originalXMLHttpRequest();
      log("¡Se ha creado un nuevo XMLHttpRequest!");
      const originalOpen = xhr.open;
      xhr.open = function(method, url) {
        log("Peticiones interceptadas: " + method + " " + url);
        originalOpen.apply(this, arguments);
      };
      return xhr;
    };

    // Sobrescribir document.write para monitorear escritura en el documento
    const originalWrite = document.write;
    document.write = function(content) {
      log("¡Escritura interceptada con document.write!");
      log("Contenido escrito: " + content);
      originalWrite.apply(this, arguments);
    };

    // Sobrescribir console.log para capturar logs
    const originalConsoleLog = console.log;
    console.log = function(message) {
      log("¡console.log interceptado!");
      log("Mensaje: " + message);
      originalConsoleLog.apply(this, arguments);
    };

    // Sobrescribir eval para monitorear ejecución de código
    const originalEval = eval;
    window.eval = function(code) {
      log("¡Código ejecutado con eval!");
      log("Código: " + code);
      return originalEval(code);
    };

    // Manipular función de alert
    const originalAlert = window.alert;
    window.alert = function(message) {
      log("¡Alerta interceptada!");
      log("Mensaje: " + message);
      return originalAlert(message);
    };

    // Ejecutar código arbitrario con setTimeout
    setTimeout(function() {
      log("¡Código arbitrario ejecutado con setTimeout!");
      alert("¡Hola desde el código de prueba!");
    }, 2000);

    // Modificar el userAgent de navigator
    const originalNavigator = Object.getOwnPropertyDescriptor(window, 'navigator').get;
    Object.defineProperty(window, 'navigator', {
      get: function() {
        const original = originalNavigator.apply(this);
        original.userAgent = "PS5 Exploit User Agent"; // Cambiamos el userAgent
        log("¡Manipulando userAgent!");
        return original;
      }
    });

    // Inyectar código HTML dinámicamente
    document.body.innerHTML += "<p><a href='#' onclick='alert(\"¡Cuidado! Este es un mensaje de alerta.\")'>Haz clic para alertar</a></p>";

    // Sobrescribir función de redirección de solicitudes fetch
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      log("Redirigiendo solicitud fetch...");
      log("URL solicitada: " + input);
      return originalFetch.call(this, input, init);
    };

    // Ejemplo de log
    log("Prueba de manipulación de funciones en PS5.");
  </script>

</body>
</html>
