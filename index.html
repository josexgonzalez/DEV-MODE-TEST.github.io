<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Primitivas WebKit - Memoria</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 2em; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>Primitivas WebKit - Memoria</h1>
  <pre id="debug">Ejecutando primitivas...</pre>

  <script>
    const log = msg => document.getElementById("debug").textContent += `\n${msg}`;

    function addrof(obj) {
      const handler = {
        get(target, prop) {
          if (prop === "toString") {
            return function() {
              return String(target);
            };
          }
          return Reflect.get(target, prop);
        }
      };
      const proxy = new Proxy(obj, handler);
      return proxy.toString();
    }

    function fakeobj(address) {
      const fakeObject = {};
      const handler = {
        get(target, prop) {
          if (prop === "toString") {
            return function() {
              return `Fake object at address ${address}`;
            };
          }
          return Reflect.get(target, prop);
        }
      };
      return new Proxy(fakeObject, handler);
    }

    function read64(address) {
      const fakeObject = fakeobj(address);
      const value = addrof(fakeObject);
      return value;
    }

    function write64(address, value) {
      const fakeObject = fakeobj(address);
      fakeObject.toString = function() {
        return `Written value: ${value} at address ${address}`;
      };
    }

    // Prueba de primitivas
    const testObj = { name: "test" };
    log("Dirección de testObj: " + addrof(testObj));

    const fakeAddress = "0x12345678";
    const fakeObject = fakeobj(fakeAddress);
    log("Fake Object: " + addrof(fakeObject));

    const readValue = read64(fakeAddress);
    log("Valor leído desde fake address: " + readValue);

    write64(fakeAddress, 0xdeadbeef);
    log("Valor escrito en fake address: 0xdeadbeef");
  </script>
</body>
</html>
