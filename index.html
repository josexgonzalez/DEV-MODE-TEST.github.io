<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Free Test - PS5</title>
</head>
<body>
    <h1>Test de Double Free (PS5)</h1>
    <p>Este código intenta provocar una condición de carrera (double free) usando WebKit en PS5.</p>
    <script>
        let sharedBuffer;
        let transferObject;

        function createBuffer() {
            // Creamos un SharedArrayBuffer que se puede transferir
            sharedBuffer = new SharedArrayBuffer(1024); // Buffer de 1 KB
            console.log("Buffer creado:", sharedBuffer);
            transferObject = { buffer: sharedBuffer };
        }

        function triggerDoubleFree() {
            // Intentamos "liberar" el buffer dos veces
            try {
                // Transferimos el buffer a otro objeto
                transferObject.buffer = null;
                console.log("Buffer transferido y liberado");
                
                // Intentamos transferir nuevamente (doble liberación)
                sharedBuffer = null;
                console.log("Buffer liberado nuevamente (simulando double free)");

            } catch (error) {
                console.error("Error al intentar doble liberación:", error);
            }
        }

        function startTest() {
            createBuffer();
            setTimeout(() => {
                triggerDoubleFree();
            }, 1000); // Esperamos 1 segundo para simular una condición de carrera
        }

        // Iniciar el test al cargar la página
        window.onload = startTest;
    </script>
</body>
</html>
