<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primitivas de Explotación de Memoria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .log {
      background-color: #f0f0f0;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      max-width: 600px;
      overflow-wrap: break-word;
    }
    .log span {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Primitivas de Explotación de Memoria</h1>
  <div id="log"></div>

  <script>
    // Función de logging para mostrar los resultados
    function log(message) {
      const logContainer = document.getElementById("log");
      const newMessage = document.createElement("div");
      newMessage.classList.add("log");
      newMessage.textContent = message;
      logContainer.appendChild(newMessage);
    }

    // Primitiva addrof - Obtener la dirección de un objeto
    function addrof(obj) {
      // Representación conceptual
      log(`Dirección de memoria de 'obj': ${obj.address}`);
      return obj.address;  // Esto simula la obtención de la dirección real del objeto.
    }

    // Primitiva fakeobj - Crear un objeto falso
    function fakeobj(address, type) {
      let fake = {};
      fake.address = address;
      fake.type = type;
      log(`Objeto falso creado en la dirección: ${address}`);
      return fake;
    }

    // Primitiva read64 - Leer 64 bits de memoria
    function read64(address) {
      // Simulación de lectura desde la memoria
      log(`Leyendo 64 bits de la dirección: ${address}`);
      return "0xDEADBEEFDEADBEEF";  // Valor simulado de lectura
    }

    // Primitiva write32 - Escribir 32 bits en una dirección
    function write32(address, value) {
      // Simulación de escritura en memoria
      log(`Escribiendo 32 bits en la dirección: ${address}`);
      log(`Valor escrito: 0x${value.toString(16)}`);
    }

    // Ejemplo de uso
    function demo() {
      // Supongamos que tenemos un objeto en memoria
      let victimObject = { name: "Objeto vulnerable", address: 0x12345678 };

      // Obtener la dirección del objeto (addrof)
      let address = addrof(victimObject);

      // Crear un objeto falso (fakeobj)
      let fake = fakeobj(address, "FakeObjectType");

      // Leer 64 bits de la memoria (read64)
      let value = read64(address);
      log(`Valor leído de la memoria: ${value}`);

      // Escribir 32 bits de memoria (write32)
      write32(address, 0xBAADF00D);  // Escribimos un valor arbitrario
    }

    // Ejecutar la demo de primitivas
    demo();
  </script>
</body>
</html>
