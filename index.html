<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Prueba fetch y Blob en PS5</title>
</head>
<body>
<h1>Prueba fetch y Blob en PS5</h1>
<button id="btnFetch">Probar fetch a recurso externo</button>
<pre id="output" style="white-space: pre-wrap; border: 1px solid #ccc; padding: 10px; max-height: 300px; overflow-y: auto;"></pre>

<script>
  const output = document.getElementById('output');
  const btn = document.getElementById('btnFetch');

  btn.addEventListener('click', async () => {
    output.textContent = 'Intentando fetch...';
    try {
      const res = await fetch('https://example.com'); // Cambia esta URL si quieres
      const text = await res.text();
      output.textContent = 'Fetch OK. Primeros 200 caracteres:\n\n' + text.slice(0, 200);
    } catch (e) {
      output.textContent = 'Fetch fallo:\n' + e;
    }

    // Prueba de Blob y FileReader en memoria
    const blob = new Blob(['Prueba de Blob y FileReader en memoria.'], {type: 'text/plain'});
    const reader = new FileReader();
    reader.onload = () => {
      output.textContent += '\n\nContenido leído de Blob:\n' + reader.result;
    };
    reader.onerror = () => {
      output.textContent += '\n\nError al leer Blob.';
    };
    reader.readAsText(blob);
  });
</script>
</body>
</html>
