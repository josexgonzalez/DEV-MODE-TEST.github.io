<!DOCTYPE html>
<html>
<head>
  <title>Multi-Iframe Stress Test</title>
  <style>
    body {
      background: black;
      color: #0f0;
      font-family: monospace;
    }
    #log {
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #0f0;
      padding: 10px;
      margin-bottom: 20px;
    }
    iframe {
      display: none;
    }
  </style>
</head>
<body>
  <div id="log">[+] Starting multi-iframe stress test...</div>

  <script>
    const log = msg => {
      const el = document.getElementById("log");
      el.textContent += msg + "\n";
      el.scrollTop = el.scrollHeight;
    };

    const iframeCode = `
<!DOCTYPE html>
<html>
  <body style='background:black; color:#0f0; font-family:monospace;'>
    <script>
      let frame = 0;
      function createShadowNode(id) {
        const host = document.createElement("div");
        host.id = "host_" + id;
        document.body.appendChild(host);

        const shadow = host.attachShadow({ mode: "open" });
        const wrapper = document.createElement("div");
        wrapper.style.display = "contents";

        for (let i = 0; i < 10; i++) {
          const span = document.createElement("span");
          span.textContent = "FZ" + id + "-" + i;
          wrapper.appendChild(span);
        }

        shadow.appendChild(wrapper);
        getComputedStyle(wrapper).color;

        if (Math.random() < 0.3) wrapper.innerHTML = "";
        if (Math.random() < 0.2) host.remove();
        if (Math.random() < 0.1) document.body.innerHTML = "";

        if (typeof gc === "function") gc();
      }

      function fuzzLoop() {
        for (let i = 0; i < 20; i++) {
          createShadowNode(frame + "_" + i);
        }
        frame++;
        requestAnimationFrame(fuzzLoop);
      }

      new MutationObserver(() => {
        if (Math.random() < 0.3)
          document.body.innerHTML = "";
      }).observe(document.body, { childList: true, subtree: true });

      setTimeout(() => requestAnimationFrame(fuzzLoop), 200);
      parent.postMessage("iframe-ready", "*");
    <\/script>
  </body>
</html>
    `.trim();

    const NUM_IFRAMES = 6;
    for (let i = 0; i < NUM_IFRAMES; i++) {
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
      iframe.srcdoc = iframeCode;
      document.body.appendChild(iframe);
      log("[+] Iframe " + i + " injected");
    }

    window.addEventListener("message", e => {
      if (e.data === "iframe-ready") {
        log("[+] Iframe responded and is running");
      }
    });
  </script>
</body>
</html>
