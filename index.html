<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Exploit - WebKit sin WASM</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 2em; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>PS5 FW 10.20 - Test WebKit sin WebAssembly</h1>
  <pre id="debug">Ejecutando prueba...</pre>

  <script>
    const log = msg => document.getElementById("debug").textContent += `\n${msg}`;

    try {
      let corrupted = false;
      const arr = [1.1, 2.2, 3.3];
      arr.sort(function(a, b) {
        arr.length = 1; // Esto es un "trigger" clásico
        corrupted = true;
        return 0;
      });

      if (corrupted && arr.length !== 3) {
        log("⚠️ POSIBLE COMPORTAMIENTO VULNERABLE DETECTADO");
      } else {
        log("❌ No se detectó comportamiento vulnerable.");
      }
    } catch (e) {
      log("❌ Error durante la prueba:");
      log(e.toString());
    }
  </script>
</body>
</html>
