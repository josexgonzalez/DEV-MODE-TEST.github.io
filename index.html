    function log(msg) {

    // Conversión float <-> int
    const f64_buf = new Float64Array(1);
    const u32_buf = new Uint32Array(f64_buf.buffer);

    function f2i(f) {
      f64_buf[0] = f;
      return [u32_buf[0], u32_buf[1]];
    }

    function i2f(lo, hi) {
      u32_buf[0] = lo;
      u32_buf[1] = hi;
      return f64_buf[0];
    }

    function hex(lo, hi) {
      return "0x" + hi.toString(16).padStart(8, "0") + lo.toString(16).padStart(8, "0");
    }
