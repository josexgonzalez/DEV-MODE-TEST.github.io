<!DOCTYPE html>
<html>
<head>
  <title>Multi-Iframe WebKit Fuzzer</title>
  <style>
    body {
      background: black;
      color: #0f0;
      font-family: monospace;
    }
    #log {
      white-space: pre;
      margin-bottom: 1em;
    }
    iframe {
      width: 0;
      height: 0;
      border: none;
    }
  </style>
</head>
<body>
  <div id="log">[+] Starting multi-iframe fuzzer...</div>

  <script>
    const log = msg => {
      const el = document.getElementById("log");
      el.textContent += msg + "\n";
    };

    const iframeCode = `
      <!DOCTYPE html>
      <html>
        <body style="background: black; color: #0f0; font-family: monospace;">
          <script>
            let frame = 0;

            function createShadowNode(id) {
              const host = document.createElement("div");
              host.id = "host_" + id;
              document.body.appendChild(host);

              const shadow = host.attachShadow({ mode: "open" });

              const wrapper = document.createElement("div");
              wrapper.style.display = "contents";

              for (let i = 0; i < 10; i++) {
                const span = document.createElement("span");
                span.textContent = "FZ" + id + "-" + i;
                wrapper.appendChild(span);
              }

              shadow.appendChild(wrapper);
              getComputedStyle(wrapper).color;

              if (Math.random() < 0.3) wrapper.innerHTML = "";
              if (Math.random() < 0.2) host.remove();
              if (Math.random() < 0.1) document.body.innerHTML = "";

              if (typeof gc === "function") gc();
            }

            function fuzzLoop() {
              for (let i = 0; i < 20; i++) {
                createShadowNode(frame + "_" + i);
              }
              frame++;
              requestAnimationFrame(fuzzLoop);
            }

            new MutationObserver(() => {
              if (Math.random() < 0.3)
                document.body.innerHTML = "";
            }).observe(document.body, { childList: true, subtree: true });

            setTimeout(() => requestAnimationFrame(fuzzLoop), 200);
          <\/script>
        </body>
      </html>
    `;

    const NUM_IFRAMES = 6;

    for (let i = 0; i < NUM_IFRAMES; i++) {
      const iframe = document.createElement("iframe");
      iframe.sandbox = "allow-scripts";
      iframe.srcdoc = iframeCode;
      document.body.appendChild(iframe);
      log(`[+] Iframe ${i} injected`);
    }
  </script>
</body>
</html>
