<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Prueba de onDrawPoints boundary check (Skia Ganesh)</title>
<style>
  body { background: #111; color: #eee; font-family: monospace; text-align: center; }
  canvas { background: black; margin: 20px auto; display: block; border: 1px solid #666; }
  #log { max-width: 512px; margin: auto; white-space: pre-wrap; background: #222; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<h2>Prueba onDrawPoints con coordenadas extremas</h2>
<canvas id="canvas" width="512" height="512"></canvas>
<div id="log">Iniciando prueba...</div>
<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const log = document.getElementById("log");

  function logMsg(msg) {
    log.textContent += msg + "\n";
  }

  function drawPoints() {
    logMsg("Dibujando puntos con coordenadas extremas...");

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "lime";

    // Intentamos dibujar 100,000 puntos con coordenadas fuera del rango
    // para forzar posibles fallos en onDrawPoints Ganesh
    try {
      for (let i = 0; i < 100000; i++) {
        // Coordenadas aleatorias en rango [-100000, 100000]
        let x = (Math.random() * 200000) - 100000;
        let y = (Math.random() * 200000) - 100000;

        // Solo dibujamos si dentro del canvas para no ralentizar mucho
        if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
          ctx.fillRect(x, y, 1, 1);
        }
      }
      logMsg("Dibujo completado sin errores aparentes.");
    } catch (e) {
      logMsg("Error durante el dibujo: " + e.message);
    }
  }

  drawPoints();
</script>
</body>
</html>
