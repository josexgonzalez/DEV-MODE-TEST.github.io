<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Corromper Función Interna</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 2em; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>Corromper Función Interna con Proxy</h1>
  <pre id="debug">Ejecutando ataque...</pre>

  <script>
    const log = msg => document.getElementById("debug").textContent += `\n${msg}`;

    function addrof(obj) {
      const handler = {
        get(target, prop) {
          if (prop === "toString") {
            return function() {
              return String(target);
            };
          }
          return Reflect.get(target, prop);
        }
      };
      const proxy = new Proxy(obj, handler);
      return proxy.toString();
    }

    function fakeobj(address) {
      const fakeObject = {};
      const handler = {
        get(target, prop) {
          if (prop === "toString") {
            return function() {
              return `Fake object at address ${address}`;
            };
          }
          return Reflect.get(target, prop);
        }
      };
      return new Proxy(fakeObject, handler);
    }

    function write64(address, value) {
      const fakeObject = fakeobj(address);
      fakeObject.toString = function() {
        return `Written value: ${value} at address ${address}`;
      };
    }

    // Corrupting internal WebKit function: document.write
    log("Intentando corromper la función 'document.write'...");
    const writeAddress = addrof(document.write);
    log(`Dirección de 'document.write': ${writeAddress}`);

    const fakeCode = function() {
      log("Código arbitrario ejecutado: ¡Hola desde el exploit!");
    };

    // Sobrescribimos 'document.write' con nuestra función
    write64(writeAddress, addrof(fakeCode));
    log("Función 'document.write' corrompida.");

    // Ejecutamos document.write para ver si se ejecuta nuestro código
    document.write("Esto debería ejecutar código arbitrario: ");
  </script>
</body>
</html>
