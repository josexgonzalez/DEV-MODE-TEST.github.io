<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PS5 10.20 - Prueba Exploit</title>
  <style>
    body { background:#000; color:#0f0; font-family:monospace; padding:2em; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>Test Exploit - PS5 FW 10.20</h1>
  <pre id="debug">Cargando...</pre>

  <script>
    const f64_buf = new Float64Array(1);
    const u32_buf = new Uint32Array(f64_buf.buffer);

    function f2i(f) {
      f64_buf[0] = f;
      return [u32_buf[0], u32_buf[1]]; // [low, high]
    }

    function i2f(lo, hi) {
      u32_buf[0] = lo;
      u32_buf[1] = hi;
      return f64_buf[0];
    }

    function hex(lo, hi) {
      return "0x" + hi.toString(16).padStart(8, "0") + lo.toString(16).padStart(8, "0");
    }

    try {
      let prueba = 13.37;
      let [lo, hi] = f2i(prueba);
      let reconstruido = i2f(lo, hi);

      document.getElementById("debug").textContent =
        "✅ Conversión f2i:\n" +
        "  Float: " + prueba + "\n" +
        "  Int:   " + hex(lo, hi) + "\n" +
        "✅ Conversión i2f:\n" +
        "  Reconstruido: " + reconstruido;

    } catch (e) {
      document.getElementById("debug").textContent = "❌ Error: " + e;
    }
  </script>
</body>
</html>
