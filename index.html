<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Imágenes Locales Embebidas</title>
</head>
<body>

    <h1>Prueba de Carga de Imágenes Locales Embebidas (Base64)</h1>

    <!-- Imagen JPEG embebida como Base64 -->
    <h2>Imagen JPEG:</h2>
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD/..." alt="Imagen JPEG" />

    <!-- Imagen PNG embebida como Base64 -->
    <h2>Imagen PNG:</h2>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..." alt="Imagen PNG" />

    <!-- Imagen WebP embebida como Base64 -->
    <h2>Imagen WebP:</h2>
    <img src="data:image/webp;base64,UklGR..." alt="Imagen WebP" />

</body>
</html>
