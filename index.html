<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS5 Scope Test Extended</title>
    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        } 
        #log {
            white-space: pre-wrap;
            font-size: 14px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .ok { color: #0f0; }
        .fail { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>PS5 Scope and Fuzzing Test</h1>
    <div id="log"></div>

    <script>
    (function() {
        const logElement = document.getElementById('log');

        function logOk(message) {
            const el = document.createElement('div');
            el.textContent = "[OK] " + message;
            el.className = "ok";
            logElement.appendChild(el);
        }
        function logFail(message) {
            const el = document.createElement('div');
            el.textContent = "[FAIL] " + message;
            el.className = "fail";
            logElement.appendChild(el);
        }
        function logInfo(message) {
            const el = document.createElement('div');
            el.textContent = "[INFO] " + message;
            el.className = "info";
            logElement.appendChild(el);
        }

        function shouldBe(actual, expected) {
            if (actual !== expected)
                throw new Error(`Bad value: ${actual}! Expected: ${expected}`);
        }

        function shouldThrow(func, errorMessage) {
            let errorThrown = false;
            try {
                func();
            } catch (error) {
                errorThrown = true;
                if (String(error) !== errorMessage)
                    throw new Error(`Bad error: ${error}`);
            }
            if (!errorThrown)
                throw new Error("Didn't throw!");
        }

        function randomBool() {
            return Math.random() < 0.5;
        }

        async function runMainTests() {
            logInfo("Running Main Scope Tests...");

            function makeScopeObject() {
                function foo() { foo.lastThisValue = this; }
                function bar() { "use strict"; bar.lastThisValue = this; }
                return { foo, bar };
            }

            function makeTestCases(ident) {
                return [
                    `${ident}()`,
                    `"use strict"; ${ident}()`,
                    `eval("${ident}()")`,
                    `eval("'use strict'; ${ident}()")`,
                    `(0, eval)("${ident}()")`,
                    `(0, eval)("'use strict'; ${ident}()")`,
                    `new Function("${ident}()")()`,
                    `new Function("'use strict'; ${ident}()")()`
                ];
            }

            for (const ident of ["foo", "bar"]) {
                const scope = makeScopeObject();

                for (const testCase of makeTestCases(ident)) {
                    for (let i = 0; i < 2; i++) { // Reducido para velocidad
                        globalThis.foo = scope.foo;
                        globalThis.bar = scope.bar;

                        try {
                            eval(testCase);

                            if (ident === "foo")
                                shouldBe(scope.foo.lastThisValue, globalThis);
                            else
                                shouldBe(scope.bar.lastThisValue, undefined);

                            logOk(`Test passed: ${testCase}`);
                        } catch (e) {
                            logFail(`Test failed: ${testCase} -> ${e.message}`);
                        }
                    }

                    delete globalThis.foo;
                    delete globalThis.bar;

                    try {
                        shouldThrow(() => { eval(testCase); }, `ReferenceError: Can't find variable: ${ident}`);
                        logOk(`Correctly threw ReferenceError: ${testCase}`);
                    } catch (e) {
                        logFail(`Should have thrown ReferenceError: ${testCase} -> ${e.message}`);
                    }
                }
            }
        }

        async function runFuzzingTests() {
            logInfo("Starting Scope Fuzzing...");

            const templates = [
                (obj) => { 
                    with(obj) { 
                        return (function() { return this; })(); 
                    }
                },
                (obj) => (function() { 
                    "use strict"; 
                    return this; 
                }).call(obj),
                (obj) => (() => { 
                    return this; 
                }).call(obj),
                (obj) => new Function("return this;").call(obj),
                (obj) => eval("this")
            ];

            for (let i = 0; i < 30; i++) { // 30 pruebas
                let obj = {};

                // Asegurarnos de no usar un objeto global o de window
                const context = (function() { 
                    return this;
                }).call(obj);

                if (randomBool()) {
                    obj = new Proxy(obj, {
                        get: (target, prop) => Reflect.get(target, prop),
                        has: () => true,
                        set: (target, prop, value) => { target[prop] = value; return true; }
                    });
                }

                try {
                    const code = templates[Math.floor(Math.random() * templates.length)](context);
                    const result = (new Function("obj", `return ${code};`))(obj);

                    // Aquí verificamos si el resultado es el esperado o no.
                    if (result !== obj && result !== undefined) {
                        throw new Error("Unexpected 'this' value!");
                    }

                    logOk(`Fuzz ${i}: OK`);
                } catch (e) {
                    logFail(`Fuzz ${i}: ${e.message}`);
                }
            }
        }

        async function main() {
            await runMainTests();
            await runFuzzingTests();
            logElement.innerHTML += "\n\n[Finished]";
        }

        main();
    })();
    </script>
</body>
</html>
