<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test WebAssembly PS5 FW 10.20</title>
  <style>
    body {
      background-color: #111;
      color: #0f0;
      font-family: monospace;
      text-align: center;
      padding-top: 5em;
    }
    #resultado {
      color: yellow;
      font-size: 1.5em;
      margin-top: 2em;
    }
  </style>
</head>
<body>
  <h1>¿Está habilitado WebAssembly?</h1>
  <p>Detectando soporte...</p>
  <div id="resultado">...</div>

  <script>
    const soporte = typeof WebAssembly;
    document.getElementById("resultado").textContent = 
      soporte === "object"
        ? "✅ WebAssembly está HABILITADO"
        : "❌ WebAssembly está DESHABILITADO";
  </script>
</body>
</html>
