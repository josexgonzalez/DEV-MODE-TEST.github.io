<!DOCTYPE html>
<html>
<head>
  <title>Syscall Checker</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    .log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>PS5 Syscall Checker: sys_fsc2h_ctrl</h2>
  <div class="log" id="log">[+] Comprobando syscalls 500–700...</div>

  <script>
    const log = (msg) => {
      const logEl = document.getElementById("log");
      logEl.textContent += "\n" + msg;
      console.log(msg);
    };

    function syscall(n, a1, a2, a3) {
      try {
        return window.syscall(n, a1, a2, a3); // Solo funcionará si tienes primitivas JS/syscall activadas por exploit
      } catch (e) {
        return -9999;
      }
    }

    async function checkSyscalls() {
      const CMD_WAIT = 0x10001;
      const pathPtr = 0; // path inválido, pero queremos ver si la syscall existe

      for (let i = 500; i <= 700; i++) {
        let res = syscall(i, CMD_WAIT, pathPtr);
        if (res === 0) {
          log(`[+] Posible syscall válida encontrada: ${i}`);
        } else if (res > -4096 && res < 0) {
          log(`[?] Syscall ${i} respondió con error conocido: ${res}`);
        }
        await new Promise(r => setTimeout(r, 50)); // evitar crash por spam
      }
      log("[*] Prueba finalizada.");
    }

    checkSyscalls();
  </script>
</body>
</html>
