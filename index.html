<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ResDev UMTX2</title>
    <link rel="stylesheet" href="main.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        #content-box {
            width: 100%;
            max-width: 1008px;
            height: 90vh;
            overflow: auto;
            position: absolute;
            top: 50%;
            left: 65%;
            transform: translate(-50%, -50%);
            background-color: rgba(51, 51, 51, 0.2);
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }

        .fixed-bottom {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .fixed-bottom-left {
            position: fixed;
            bottom: 10px;
            left: 10px;
            margin: 0;
        }

        #main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 100px;
            left: 50px;
            width: 91%;
            height: 10.5%;
        }
    </style>
</head>

<body>

    <div id="content-box">

        <div style="margin: 40px;">
            <p class="text-secondary"><span class="fw-bold" id="ip"></span></p>
        </div>

        <div id="main-content">
            <div id="pre-jb-view" class="d-flex align-items-center justify-content-center flex-direction-column selected">
                <a tabindex="0" class="btn fw-bold" id="run-jb" onclick="run()">Ejecutar</a>
            </div>

            <script>
                setTimeout(() => {
                    document.getElementById('run-jb').click();
                }, 3000);
            </script>

            <div id="console-view">
                <div id="console" class="log"></div>
            </div>

            <div id="payloads-view"></div>
        </div>

    </div>

    <!-- Información en la esquina inferior izquierda -->
    <p class="text-secondary fixed-bottom-left">
        <span class="fw-bold" id="listening-ip"></span>
    </p>
    <p class="text-secondary fixed-bottom-left" style="bottom: 30px;">
        <span class="fw-bold" id="current-fw"></span>
    </p>

    <!-- Créditos -->
    <div class="fixed-bottom">
        <h4 class="info opacity-transition"><b>UPDATED [29/03/25]</b></h4>
    </div>

    <!-- Scripts -->
    <script src="int64.js"></script>
    <script src="rop.js"></script>
    <script src="main.js"></script>
    <script src="umtx2.js"></script>
    <script src="custom_host_stuff.js"></script>
    <script src="syscalls.js"></script>
    <script type="module" src="psfree/psfree.js"></script>
    <script src="payload_map.js"></script>

    <script>
        addEventListener('unhandledrejection', (event) => {
            const reason = event.reason;
            alert(
                `${reason}\n` +
                `${reason.sourceURL}:${reason.line}:${reason.column}\n` +
                `${reason.stack}`
            );
            throw reason;
        });

        registerAppCacheEventHandlers();
        registerL2ButtonHandler();

        window.onload = function () {
            let autoload = sessionStorage.getItem(SESSIONSTORE_ON_LOAD_AUTORUN_KEY);
            if (autoload) {
                run(autoload == "wkonly", false);
            }
        };
    </script>

</body>

</html>
