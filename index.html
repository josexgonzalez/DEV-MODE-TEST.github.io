<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🧠 DOM Crash Test</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>🔁 DOM Mutation Flood</h1>
  <div id="target"></div>

  <script>
    const target = document.getElementById("target");

    const observer = new MutationObserver(() => {
      // A veces el simple logging puede causar problemas si el buffer es demasiado grande
      console.log("⚠️ Mutación detectada");
    });

    observer.observe(target, {
      childList: true,
      subtree: true
    });

    function floodDOM() {
      for (let i = 0; i < 5000; i++) {
        const el = document.createElement("div");
        el.textContent = "N".repeat(1000);
        target.appendChild(el);
      }
      target.innerHTML = ""; // Borra todos los nodos, causando mutaciones masivas
    }

    setInterval(floodDOM, 10); // Ejecuta sin parar
  </script>
</body>
</html>
