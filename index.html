<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebRTC Detection PoC (PS5)</title>
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    #log {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <h1>WebRTC Detection</h1>
  <div id="log">Checking for WebRTC support...</div>

  <script>
    function log(msg) {
      document.getElementById('log').textContent += '\n' + msg;
      console.log(msg);
    }

    try {
      const rtc = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;

      if (rtc) {
        log("✅ WebRTC API detected.");
        const pc = new rtc();

        if (pc.createDataChannel) {
          log("✅ createDataChannel is available.");
        } else {
          log("❌ createDataChannel is not available.");
        }

        if (pc.createOffer) {
          log("✅ createOffer is available.");
        } else {
          log("❌ createOffer is not available.");
        }

        pc.close();
      } else {
        log("❌ WebRTC not supported.");
      }
    } catch (e) {
      log("❌ Exception occurred: " + e.message);
    }
  </script>
</body>
</html>
