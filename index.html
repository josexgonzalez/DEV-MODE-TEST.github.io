<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Imágenes Locales Embebidas (Base64) en PS5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
        }
        h2 {
            font-size: 20px;
        }
        img {
            margin: 20px;
            border: 2px solid #fff;
            padding: 5px;
            max-width: 80%;
            height: auto;
        }
        .image-container {
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Prueba de Carga de Imágenes Locales Embebidas (Base64) en PS5</h1>

    <p>Este PoC prueba la carga de imágenes embebidas directamente en el HTML (formato base64).</p>

    <!-- Contenedor para las imágenes -->
    <div class="image-container">

        <!-- Imagen JPEG embebida como Base64 -->
        <h2>Imagen JPEG (Base64):</h2>
        <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD/..." alt="Imagen JPEG" id="imgJpeg" />

        <!-- Imagen PNG embebida como Base64 -->
        <h2>Imagen PNG (Base64):</h2>
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..." alt="Imagen PNG" id="imgPng" />

        <!-- Imagen WebP embebida como Base64 -->
        <h2>Imagen WebP (Base64):</h2>
        <img src="data:image/webp;base64,UklGR..." alt="Imagen WebP" id="imgWebp" />

    </div>

    <script>
        // Comprobamos que las imágenes se cargan correctamente
        window.onload = function() {
            let images = document.getElementsByTagName('img');
            let allLoaded = true;
            for (let img of images) {
                if (!img.complete) {
                    allLoaded = false;
                    break;
                }
            }

            if (allLoaded) {
                alert('¡Todas las imágenes han cargado correctamente!');
            } else {
                alert('Error: Algunas imágenes no se cargaron correctamente.');
            }

            // Simulación de lectura y escritura en memoria usando ArrayBuffer y TypedArrays
            manipulateMemory();
        };

        // Funciones de manipulación de memoria simuladas (conceptuales)
        function manipulateMemory() {
            // Creamos un ArrayBuffer para manipular la memoria
            let buffer = new ArrayBuffer(16); // Buffer de 16 bytes
            let view = new DataView(buffer);

            // Función addrof: obtener la "dirección" de un objeto en memoria (simulado)
            function addrof(object) {
                // En este contexto solo retornamos una "dirección" ficticia
                return object ? 0xDEADBEEF : 0;  // Dirección ficticia
            }

            // Función write64: escribir 64 bits en memoria
            function write64(address, value) {
                // Usamos el DataView para escribir en la dirección de memoria simulada
                if (address !== 0) {
                    view.setBigInt64(0, BigInt(value), true);  // Escribimos 64 bits
                    console.log(`Escribiendo 64 bits en la dirección ${address}: ${value}`);
                }
            }

            // Función read64: leer 64 bits desde una "dirección" de memoria
            function read64(address) {
                if (address !== 0) {
                    let value = view.getBigInt64(0, true);  // Leemos los 64 bits
                    console.log(`Leyendo 64 bits desde la dirección ${address}: ${value}`);
                    return value;
                }
                return 0;
            }

            // Simulamos la manipulación de un objeto
            let obj = { name: "Imagen Prueba" };

            // Obtener "dirección" del objeto (simulada)
            let address = addrof(obj);

            // Escribir en la "memoria" (Buffer simulado)
            write64(address, 1234567890);

            // Leer desde la "memoria"
            let value = read64(address);
            console.log("Valor leído de la memoria: " + value);
        }
    </script>

</body>
</html>
