<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PS5 Proxy Fuzzer</title>
<style>
body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
#log { white-space: pre-wrap; font-size: 14px; max-height: 80vh; overflow-y: auto; }
.ok { color: #0f0; }
.fail { color: #f00; }
.info { color: #0ff; }
</style>
</head>
<body>
<h1>PS5 Proxy Type Confusion Test</h1>
<div id="log"></div>
<script>
(function() {
    const logElement = document.getElementById('log');
    function logOk(message) {
        const el = document.createElement('div');
        el.textContent = "[OK] " + message;
        el.className = "ok";
        logElement.appendChild(el);
    }
    function logFail(message) {
        const el = document.createElement('div');
        el.textContent = "[FAIL] " + message;
        el.className = "fail";
        logElement.appendChild(el);
    }
    function logInfo(message) {
        const el = document.createElement('div');
        el.textContent = "[INFO] " + message;
        el.className = "info";
        logElement.appendChild(el);
    }

    function randomBool() {
        return Math.random() < 0.5;
    }

    async function runProxyTests() {
        logInfo("Iniciando fuzzing de Proxies anómalos...");

        for (let i = 0; i < 100; i++) {
            let target = {};
            let trap = {};

            if (randomBool()) {
                trap.get = function(t, prop, rec) {
                    if (typeof prop === 'string' && prop.startsWith("leak"))
                        return 0xdeadbeef;
                    return Reflect.get(t, prop, rec);
                };
            }

            if (randomBool()) {
                trap.has = function(t, prop) {
                    return true; // decimos que TODO existe
                };
            }

            if (randomBool()) {
                trap.ownKeys = function(t) {
                    return ['foo', 'bar', 'baz', Math.random() < 0.5 ? 'qux' : Symbol('sym')];
                };
            }

            const proxy = new Proxy(target, trap);

            try {
                with(proxy) {
                    let testVal = leak123 || 0;

                    if (testVal === 0xdeadbeef) {
                        logOk(`Leak detectado en prueba ${i}! Valor: ${testVal.toString(16)}`);
                    }

                    if (typeof foo === 'object' || typeof foo === 'function') {
                        logFail(`Type confusion detectado en prueba ${i}: tipo inesperado`);
                    }
                }
            } catch (e) {
                logFail(`Error capturado en prueba ${i}: ${e.message}`);
            }
        }

        logInfo("Fuzzing de proxies finalizado.");
    }

    async function main() {
        await runProxyTests();
        logElement.innerHTML += "\n\n[Finished]";
    }

    main();
})();
</script>
</body>
</html>
