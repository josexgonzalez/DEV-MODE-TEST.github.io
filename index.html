<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas de Desbordamiento y Manipulación del Heap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        pre {
            background-color: #333;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Pruebas de Desbordamiento y Manipulación del Heap</h1>
    <pre id="output"></pre>

    <script>
        // Función para mostrar los resultados en la página
        function log(message) {
            const output = document.getElementById('output');
            output.textContent += message + "\n";
        }

        // Desbordamiento de búfer con ArrayBuffer
        function testBufferOverflow() {
            log("[INFO] Iniciando prueba de desbordamiento de búfer.");

            // Creamos un buffer de 16 bytes
            let heapObject = { buffer: new ArrayBuffer(16) };

            // Intentamos acceder al buffer y escribir fuera de los límites
            try {
                let dv = new DataView(heapObject.buffer);
                dv.setUint32(20, 0xdeadbeef);  // Escribimos fuera de los límites del buffer (fuera de 16 bytes)
                log("[ERROR] Desbordamiento exitoso! Escribimos fuera de los límites.");
            } catch (e) {
                log("[INFO] Desbordamiento no permitido. Error: " + e);
            }

            log("[INFO] Fin de la prueba de desbordamiento de búfer.");
        }

        // Manipulación de datos a través de DataView
        function testDataViewManipulation() {
            log("[INFO] Iniciando prueba de manipulación con DataView.");

            // Creamos un buffer de 64 bytes
            let heapObject = { buffer: new ArrayBuffer(64) };

            // Modificamos la posición 32 del buffer
            let dv = new DataView(heapObject.buffer);
            dv.setUint32(32, 0x12345678);
            log("[INFO] Escribimos el valor 0x12345678 en la posición 32 del buffer.");

            // Leemos el valor en la posición 32 del buffer
            let value = dv.getUint32(32);
            log("[INFO] Leímos el valor de la posición 32: " + value.toString(16));

            log("[INFO] Fin de la prueba de manipulación con DataView.");
        }

        // Manipulación de punteros en el heap
        function testPointerManipulation() {
            log("[INFO] Iniciando prueba de manipulación de punteros.");

            let heapObject = {
                callback: function() {
                    log("[INFO] Ejecutando función original.");
                },
                buffer: new ArrayBuffer(8)
            };

            let handler = {
                get: function(target, prop) {
                    if (prop === 'callback') {
                        // Cambiamos el comportamiento del callback
                        return function() {
                            log("[INFO] Callback malicioso ejecutado.");
                        };
                    }
                    return target[prop];
                },
                set: function(target, prop, value) {
                    if (prop === 'buffer') {
                        let dv = new DataView(target.buffer);
                        // Modificamos el puntero en el buffer
                        dv.setUint32(4, value);
                        log("[INFO] Escribimos un puntero malicioso en el buffer: " + value.toString(16));
                    }
                    return true;
                }
            };

            let proxy = new Proxy(heapObject, handler);

            // Cambiamos el puntero del callback
            proxy.buffer = 0x12345678;

            // Ejecutamos el callback, que ahora apunta a la función maliciosa
            proxy.callback();
            log("[INFO] Fin de la prueba de manipulación de punteros.");
        }

        // Llamadas a las pruebas
        testBufferOverflow();
        testDataViewManipulation();
        testPointerManipulation();
    </script>
</body>
</html>
