<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS5 Buffer Overflow Test - Advanced</title>
    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        #log {
            white-space: pre-wrap;
            font-size: 14px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .ok { color: #0f0; }
        .fail { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>PS5 Advanced Buffer Overflow Test</h1>
    <div id="log"></div>

    <script>
        const logElement = document.getElementById('log');

        function logOk(message) {
            const el = document.createElement('div');
            el.textContent = "[OK] " + message;
            el.className = "ok";
            logElement.appendChild(el);
        }

        function logFail(message) {
            const el = document.createElement('div');
            el.textContent = "[FAIL] " + message;
            el.className = "fail";
            logElement.appendChild(el);
        }

        function logInfo(message) {
            const el = document.createElement('div');
            el.textContent = "[INFO] " + message;
            el.className = "info";
            logElement.appendChild(el);
        }

        async function advancedBufferTest() {
            logInfo("Iniciando prueba avanzada de desbordamiento de búfer...");

            // Creamos un objeto con un prototipo manipulable
            const targetObject = {
                prop: 0x12345678
            };

            // Manipulamos el prototipo para agregar propiedades
            const prototypeObject = {
                overflowProp: 0xdeadbeef
            };

            Object.setPrototypeOf(targetObject, prototypeObject);

            logInfo("Prototipo manipulado correctamente.");

            // Usamos Proxy para interceptar el acceso a las propiedades
            const proxy = new Proxy(targetObject, {
                get(target, prop, receiver) {
                    if (prop === 'overflowProp') {
                        logInfo(`Interceptando acceso a overflowProp: ${target[prop]}`);
                        return 0x87654321;  // Cambiar el valor a un valor inesperado
                    }
                    return Reflect.get(...arguments);
                }
            });

            logInfo("Proxy activado para manipulación de propiedades.");

            // Intentamos escribir un valor fuera de los límites
            try {
                proxy.overflowProp = 0x99999999;
                logOk("Valor de overflowProp modificado exitosamente a: " + proxy.overflowProp);
            } catch (e) {
                logFail("Error al intentar modificar overflowProp: " + e.message);
            }

            // Verificamos el comportamiento de desbordamiento en el búfer
            const buffer = new ArrayBuffer(16);
            const view = new DataView(buffer);
            try {
                view.setUint32(20, 0x12345678); // Intento de escritura fuera de los límites
                logFail("Escritura fuera de los límites no bloqueada.");
            } catch (e) {
                logOk("Desbordamiento fuera de los límites correctamente bloqueado: " + e.message);
            }

            logInfo("Fin de la prueba avanzada.");
        }

        advancedBufferTest();
    </script>
</body>
</html>
