  <script>
    const log = msg => document.getElementById("debug").textContent += `\n${msg}`;

    // Módulo WebAssembly embebido (con call_indirect vulnerable a confusión de tipo)
    const wasmBase64 = `
AGFzbQEAAAABCAJgAX8AYAAAAwEBAQcBAgMABQcDAAECCAEBAAAABQEDAgM=
    `.trim();

    const wasmCode = Uint8Array.from(atob(wasmBase64), c => c.charCodeAt(0));

    WebAssembly.instantiate(wasmCode, {}).then(({ instance }) => {
      log("✅ Módulo WebAssembly cargado");

      // Aquí normalmente se construyen tablas manipulables, o se desencadena call_indirect mal formado
      log("⚠️ Falta implementar la confusión con tabla indirecta");

    }).catch(err => {
      log("❌ Error al cargar WebAssembly:");
      log(err.message);
    });
  </script>
