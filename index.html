<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Exploit PS5 - WASM Table</title>
  <style>
    body { background:#000; color:#0f0; font-family:monospace; padding:2em; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>PS5 FW 10.20 - Test Tabla WebAssembly</h1>
  <pre id="debug">Cargando módulo...</pre>

  <script>
    const log = msg => document.getElementById("debug").textContent += `\n${msg}`;

    // Módulo .wasm válido: define una tabla y una función simple que retorna 42
    const wasmBase64 = `
AGFzbQEAAAABBgFgAn9/AX8DAgEABwEDfwF/AwIBAAcCAwEABwR/AwMBBQp/AwMBB2V4cG9ydAAABw==
    `.trim(); // Módulo mínimo exportando una función

    const wasmCode = Uint8Array.from(atob(wasmBase64), c => c.charCodeAt(0));

    WebAssembly.instantiate(wasmCode, {}).then(({ instance }) => {
      log("✅ WebAssembly cargado con éxito");
      log("🔢 Resultado de llamada: " + instance.exports[""]());

    }).catch(err => {
      log("❌ Error al cargar WebAssembly:");
      log(err.message);
    });
  </script>
</body>
</html>
