<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PS5 10.20 TypedArray Leak Test</title>
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    #log {
      margin-top: 20px;
      white-space: pre-wrap;
    }
    .fail {
      color: #f00;
    }
    .success {
      color: #0f0;
    }
  </style>
</head>
<body>
  <h1>PS5 TypedArray Leak/Corruption Test</h1>
  <div id="log"></div>

  <script>
    const logDiv = document.getElementById('log');

    function logOk(msg) {
      const e = document.createElement('div');
      e.className = 'success';
      e.textContent = '[OK] ' + msg;
      logDiv.appendChild(e);
    }

    function logFail(msg) {
      const e = document.createElement('div');
      e.className = 'fail';
      e.textContent = '[FAIL] ' + msg;
      logDiv.appendChild(e);
    }

    function floatToHex(f) {
      const buf = new ArrayBuffer(8);
      const f64 = new Float64Array(buf);
      const u32 = new Uint32Array(buf);
      f64[0] = f;
      return '0x' + u32[1].toString(16).padStart(8, '0') + u32[0].toString(16).padStart(8, '0');
    }

    function runTest() {
      logOk('Iniciando test de TypedArrays...');

      try {
        const buffer = new ArrayBuffer(0x1000);
        const float64 = new Float64Array(buffer);
        const uint32 = new Uint32Array(buffer);

        // Escribir un valor flotante especial
        float64[0] = 1.23456789e300;
        const valHex = floatToHex(float64[0]);

        // Leer como enteros
        const low = uint32[0];
        const high = uint32[1];

        if (low === 0 || high === 0) {
          logFail('Leak posible: valores 0 inesperados');
        } else {
          logOk('Valores normales detectados: low=0x' + low.toString(16) + ', high=0x' + high.toString(16));
        }

        // Intentar detectar corrupción de memoria
        for (let i = 0; i < float64.length; i++) {
          if (float64[i] !== 0 && i !== 0) {
            logFail('Corrupción detectada en offset ' + i + ': ' + floatToHex(float64[i]));
          }
        }

        logOk('Test finalizado.');

      } catch (e) {
        logFail('Excepción atrapada: ' + e.toString());
      }
    }

    // Auto-iniciar
    window.onload = runTest;
  </script>
</body>
</html>
