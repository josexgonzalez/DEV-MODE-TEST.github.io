<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PS5 Syscall Scanner</title>
  <style>
    body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
    #log { white-space: pre; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🛠️ Buscando sys_fsc2h_ctrl (PS5 FW 10.20)</h2>
  <div id="log">[+] Iniciando búsqueda...</div>

  <script>
    const logEl = document.getElementById("log");
    const log = (msg) => {
      logEl.textContent += "\n" + msg;
      console.log(msg);
    };

    async function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function buscarSyscall() {
      const CMD_WAIT = 0x10001;
      const fake_path = 0; // Simulación: NULL pointer

      for (let sc = 500; sc <= 700; sc++) {
        try {
          let result = ps5.syscall(sc, CMD_WAIT, fake_path);
          if (result === 0) {
            log(`[+] Posible syscall encontrada en ${sc} (res = ${result})`);
          } else if (result > -4096 && result < 0) {
            log(`[?] Syscall ${sc} respondió error (res = ${result})`);
          }
        } catch (e) {
          log(`[-] syscall ${sc} generó excepción`);
        }

        await sleep(50); // Pequeña pausa para evitar saturación
      }

      log("[*] Búsqueda finalizada.");
    }

    if (typeof ps5 !== 'undefined' && ps5.syscall) {
      buscarSyscall();
    } else {
      log("[-] No se encontró objeto ps5.syscall. ¿Cargaste el exploit?");
    }
  </script>
</body>
</html>
