<!DOCTYPE html>
<html>
<head>
  <title>WebKit Crash Attempt (DOM Focused)</title>
  <style>
    body { background: black; color: lime; font-family: monospace; }
    .bomb { width: 50px; height: 50px; background: red; position: absolute; }
  </style>
</head>
<body>
  <h1>Test: DOM Flooding sin ArrayBuffer</h1>
  <pre id="log">Iniciando...</pre>

  <script>
    const log = txt => document.getElementById("log").textContent += "\n" + txt;

    let container = document.createElement("div");
    document.body.appendChild(container);

    let count = 0;
    let interval = setInterval(() => {
      for (let i = 0; i < 100; i++) {
        let el = document.createElement("div");
        el.className = "bomb";
        el.style.left = `${Math.random() * window.innerWidth}px`;
        el.style.top = `${Math.random() * window.innerHeight}px`;
        el.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 5})`;
        container.appendChild(el);
      }

      count += 100;
      log(`Creados ${count} elementos`);

      if (count > 10000) {
        log("Finalizando test.");
        clearInterval(interval);
      }
    }, 100);
  </script>
</body>
</html>
