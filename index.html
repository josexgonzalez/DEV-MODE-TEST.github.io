<!DOCTYPE html>
<html>
<head>
  <title>Test ALAC PS5</title>
  <style>
    body { background: #111; color: #0f0; font-family: monospace; padding: 2em; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Verificación de ALAC en PS5</h2>
  <audio id="player" src="corrupted.m4a" controls autoplay></audio>
  <div id="log">Cargando audio...</div>

  <script>
    const log = (msg) => {
      document.getElementById("log").textContent += "\n" + msg;
    };

    const player = document.getElementById("player");
    player.oncanplay = () => log("✅ Puede reproducirse (ALAC soportado)");
    player.onerror = () => log("❌ Error al reproducir (archivo rechazado o crash)");
  </script>
</body>
</html>
