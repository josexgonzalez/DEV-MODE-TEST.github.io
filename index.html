<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS5 Scope Test</title>
    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        } 
        #log {
            white-space: pre-wrap;
            font-size: 14px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .ok { color: #0f0; }
        .fail { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>PS5 Scope and Fuzzing Test</h1>
    <div id="log"></div>

    <script>
    (function() {
        const logElement = document.getElementById('log');

        function logOk(message) {
            const el = document.createElement('div');
            el.textContent = "[OK] " + message;
            el.className = "ok";
            logElement.appendChild(el);
        }
        function logFail(message) {
            const el = document.createElement('div');
            el.textContent = "[FAIL] " + message;
            el.className = "fail";
            logElement.appendChild(el);
        }
        function logInfo(message) {
            const el = document.createElement('div');
            el.textContent = "[INFO] " + message;
            el.className = "info";
            logElement.appendChild(el);
        }

        // Test básico con función simple que evalúa el contexto de 'this'
        function basicTest() {
            logInfo("Running Basic Test...");

            // Test 1: Sin "use strict" y sin contexto específico
            function testFoo() { return this; }
            const result1 = testFoo();
            if (result1 === window || result1 === globalThis) { // en entorno global debería devolver window
                logOk("Test 1 passed (Global context).");
            } else {
                logFail("Test 1 failed (Unexpected this value).");
            }

            // Test 2: Con "use strict"
            function testStrictFoo() { "use strict"; return this; }
            const result2 = testStrictFoo();
            if (result2 === undefined) { // En modo 'strict', 'this' es undefined
                logOk("Test 2 passed (Strict mode).");
            } else {
                logFail("Test 2 failed (Unexpected this value in strict mode).");
            }
        }

        // Función de fuzzing para probar el contexto con diferentes técnicas
        async function runFuzzingTests() {
            logInfo("Starting Fuzzing Tests...");

            const fuzzCases = [
                () => { return this; }, // Caso 1: this en contexto global
                () => { "use strict"; return this; }, // Caso 2: 'use strict' - should return undefined
                function() { return this; }, // Caso 3: Función simple, 'this' en contexto global
                function() { "use strict"; return this; } // Caso 4: Función en modo estricto
            ];

            // Probar 10 iteraciones
            for (let i = 0; i < 10; i++) {
                const test = fuzzCases[i % fuzzCases.length];

                try {
                    const result = test();
                    if (result === globalThis || result === undefined) {
                        logOk(`Fuzz ${i}: OK`);
                    } else {
                        throw new Error(`Unexpected 'this' value`);
                    }
                } catch (e) {
                    logFail(`Fuzz ${i}: ${e.message}`);
                }
            }
        }

        async function main() {
            basicTest();  // Ejecutar test básico
            await runFuzzingTests(); // Ejecutar fuzzing
            logElement.innerHTML += "\n\n[Finished]";
        }

        main();
    })();
    </script>
</body>
</html>
