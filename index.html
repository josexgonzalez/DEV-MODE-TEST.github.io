<!DOCTYPE html>
<html>
<head>
  <title>WebKit Exploit Test - Heap Fragment + Canvas</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>WebKit Aggressive Test (PS5)</h1>
  <pre id="log">Iniciando...</pre>

  <script>
    const log = msg => document.getElementById("log").textContent += "\n" + msg;

    const buffers = [];
    const holes = [];

    function sprayMemory() {
      log("Spray inicial: ArrayBuffer pequeños (fragmentación)");

      for (let i = 0; i < 1000; i++) {
        // Alternamos tamaños para crear huecos en el heap
        let size = (i % 2 === 0) ? 0x1000 : 0x2000;
        buffers.push(new ArrayBuffer(size));
      }

      // Liberar algunos bloques para crear huecos
      for (let i = 0; i < buffers.length; i += 3) {
        buffers[i] = null;
        holes.push(i);
      }

      log("Fragmentación completa. Reservando bloques más grandes...");

      for (let i = 0; i < 50; i++) {
        buffers.push(new ArrayBuffer(1024 * 1024)); // 1 MB
      }

      log("Spray finalizado. Ejecutando presión gráfica...");
      stressCanvas();
    }

    function stressCanvas() {
      let canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      document.body.appendChild(canvas);
      let ctx = canvas.getContext("2d");

      let frames = 0;

      const interval = setInterval(() => {
        for (let i = 0; i < 100; i++) {
          ctx.fillStyle = `rgba(${Math.random()*255},${Math.random()*255},${Math.random()*255},1)`;
          ctx.fillRect(Math.random()*1024, Math.random()*1024, 50, 50);
        }

        // Fuerza a WebKit a codificar el canvas a base64 (mucha presión de CPU y RAM)
        try {
          canvas.toDataURL("image/png");
        } catch (e) {
          log("Error en toDataURL: " + e.message);
        }

        frames++;
        if (frames > 60) {
          clearInterval(interval);
          log("Finalizado. Si no se colgó, está bien parcheado.");
        }
      }, 100);
    }

    log("Iniciando test...");
    setTimeout(sprayMemory, 500);
  </script>
</body>
</html>
