<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebAssembly Check</title>
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    #status {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1>🧪 WebAssembly Check</h1>
  <div id="status">Checking...</div>

  <script>
    const status = document.getElementById('status');

    try {
      const valid = WebAssembly.validate(new Uint8Array([
        0x00, 0x61, 0x73, 0x6D, // '\0asm' magic
        0x01, 0x00, 0x00, 0x00  // version 1
      ]));

      if (valid) {
        status.textContent = "✅ WebAssembly is ENABLED.";
        status.style.color = "#0f0";
      } else {
        status.textContent = "❌ WebAssembly is DISABLED.";
        status.style.color = "#f00";
      }
    } catch (e) {
      status.textContent = "❌ WebAssembly check failed: " + e;
      status.style.color = "#f00";
    }
  </script>
</body>
</html>
