<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Prueba FileReader en PS5</title>
</head>
<body>
<h1>Prueba FileReader en PS5</h1>
<p>Selecciona un archivo para leer su contenido:</p>
<input type="file" id="fileInput" />
<pre id="fileContent" style="white-space: pre-wrap; border: 1px solid #ccc; padding: 10px; max-height: 300px; overflow-y: auto;"></pre>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileContent = document.getElementById('fileContent');

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) {
      fileContent.textContent = 'No se ha seleccionado ningún archivo.';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      fileContent.textContent = reader.result;
    };
    reader.onerror = () => {
      fileContent.textContent = 'Error al leer el archivo.';
    };
    reader.readAsText(file);
  });
</script>
</body>
</html>
