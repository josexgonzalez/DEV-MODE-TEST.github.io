<!DOCTYPE html>
<html>
<head>
  <title>WebKit PS5 Fuzzer - display: contents</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
    }
    #log {
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="log">[+] Starting fuzzer...\n</div>

  <script>
    const log = (msg) => {
      document.getElementById('log').textContent += msg + '\n';
    };

    let runCount = 0;
    let keepFuzzing = true;

    function createRandomNode() {
      let d = document.createElement('div');
      d.style.display = 'contents';
      for (let i = 0; i < Math.random() * 10; i++) {
        let s = document.createElement('span');
        s.textContent = 'FUZZ' + Math.random();
        d.appendChild(s);
      }
      return d;
    }

    function fuzzCycle() {
      if (!keepFuzzing) return;

      try {
        let container = document.createElement('div');
        container.id = 'container_' + runCount;
        document.body.appendChild(container);

        // Spray nodes
        for (let i = 0; i < 500; i++) {
          let node = createRandomNode();
          container.appendChild(node);
        }

        // Trigger layout
        [...container.querySelectorAll('span')].forEach(el => {
          getComputedStyle(el).color;
        });

        // Randomize removal
        if (runCount % 2 === 0) {
          container.innerHTML = '';
        } else {
          container.remove();
        }

        // Occasionally clear entire DOM
        if (runCount % 5 === 0) {
          document.body.innerHTML = '<div id="log">[+] Reset DOM</div>';
        }

        // Force GC if available
        if (window.gc) window.gc();

        log(`[+] Fuzz cycle ${runCount} complete`);

        runCount++;
      } catch (e) {
        log('[!] Exception: ' + e.message);
      }

      setTimeout(fuzzCycle, 50);
    }

    // Optional: DOM mutation observer to add race conditions
    const observer = new MutationObserver(() => {
      if (Math.random() < 0.5) {
        document.body.innerHTML = '<div id="log">[+] Mutation Reset</div>';
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });

    // Start
    setTimeout(fuzzCycle, 500);
  </script>
</body>
</html>
