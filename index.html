<!DOCTYPE html>
<html>
<head>
  <title>WebKit Hybrid Crash PoC</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: monospace;
    }
    .box {
      width: 60px;
      height: 60px;
      background: rgba(255, 0, 0, 0.3);
      position: absolute;
      transition: transform 0.05s linear;
    }
  </style>
</head>
<body>
  <h1>Ejecutando prueba híbrida WebKit...</h1>
  <pre id="log">Inicializando...</pre>

  <script>
    const log = msg => document.getElementById("log").textContent += "\n" + msg;

    try {
      log("Generando elementos dinámicos y transformaciones...");

      const container = document.createElement("div");
      document.body.appendChild(container);

      // Crear muchos elementos con transformaciones
      for (let i = 0; i < 3000; i++) {
        const div = document.createElement("div");
        div.className = "box";
        div.style.left = `${Math.random() * window.innerWidth}px`;
        div.style.top = `${Math.random() * window.innerHeight}px`;
        div.style.transform = `rotate(${Math.random() * 360}deg) scale(${1 + Math.random() * 3})`;
        container.appendChild(div);
      }

      log("Reservando memoria controlada con ArrayBuffer...");

      let buffers = [];
      let totalMB = 0;

      // Solo reservamos hasta ~200 MB para evitar el error
      for (let i = 0; i < 200; i++) {
        buffers.push(new ArrayBuffer(1024 * 1024)); // 1 MB
        totalMB++;
        if (i % 20 === 0) log(`ArrayBuffers: ${totalMB} MB`);
      }

      log("Estresando el motor con cambios rápidos...");

      let tick = 0;
      const interval = setInterval(() => {
        container.childNodes.forEach(node => {
          node.style.transform = `rotate(${tick}deg) scale(${1 + (tick % 5)})`;
        });
        tick += 15;
        if (tick > 5000) {
          clearInterval(interval);
          log("Prueba completada.");
        }
      }, 50);

    } catch (e) {
      log("Excepción atrapada: " + e.toString());
    }
  </script>
</body>
</html>
