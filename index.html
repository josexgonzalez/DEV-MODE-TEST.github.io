<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS5 Media Parser Test</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; padding: 2em; }
        section { margin-bottom: 2em; }
        h2 { color: #f55; }
    </style>
</head>
<body>
    <h1>PS5 Media Parser Test</h1>

    <section>
        <h2>🖼️ Malicious JPG</h2>
        <img src="malicious.jpg" alt="Malicious JPG">
    </section>

    <section>
        <h2>🎵 Malicious MP3</h2>
        <audio controls autoplay>
            <source src="malicious.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>

    <section>
        <h2>🎞️ Malicious MP4</h2>
        <video width="320" height="240" controls autoplay>
            <source src="malicious.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <section>
        <h2>🖼️ Malicious WAV (as audio)</h2>
        <audio controls autoplay>
            <source src="malicious.wav" type="audio/wav">
            Your browser does not support the audio element.
        </audio>
    </section>

</body>
</html>
