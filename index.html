<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PS5 MemCorrupt PoC</title>
  <style>
    body { background:black; color:lime; font-family: monospace; padding:10px; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>PS5 MemCorrupt PoC</h1>
  <pre id="log"></pre>

<script>
  const log = document.getElementById("log");
  function print(msg) {
    log.textContent += msg + "\n";
    console.log(msg);
  }

  // Crear canvas y contexto
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");

  function corruptImageData() {
    print("[*] Intentando corrupción ImageData...");
    try {
      let img = ctx.createImageData(256, 256);
      // Rellenar con valores inválidos intencionales para overflow
      for(let i=0; i<img.data.length; i++) {
        if(i % 4 === 3) img.data[i] = 300;  // alpha inválido (>255)
        else img.data[i] = 500;             // valores inválidos
      }
      ctx.putImageData(img, 0, 0);
      print("[+] putImageData ejecutado.");
      // Leer datos para detectar corrupción
      let check = img.data[100];
      print("[*] Valor leído img.data[100]: " + check);
    } catch(e) {
      print("[!] Error corrupción ImageData: " + e);
    }
  }

  window.onload = () => {
    corruptImageData();
  }
</script>
</body>
</html>
