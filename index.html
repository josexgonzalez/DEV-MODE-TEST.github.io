<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PS5 LockdownMode PoC</title>
  <style>
    body {
      background-color: #111;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    img {
      max-width: 100px;
      display: block;
      margin: 10px 0;
    }
    .result {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>PS5 10.20 LockdownMode Test</h1>
  <div id="log"></div>

  <script>
    const log = (msg) => {
      document.getElementById('log').innerHTML += `<div class="result">${msg}</div>`;
    };

    const testImage = (src, label) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          log(`✅ ${label} loaded`);
          resolve({ label, success: true });
        };
        img.onerror = () => {
          log(`❌ ${label} blocked`);
          resolve({ label, success: false });
        };
        img.src = src;
        document.body.appendChild(img);
      });
    };

    (async () => {
      log("🔍 Testing image formats...");

      const results = await Promise.all([
        testImage("https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png", "PNG"),
        testImage("https://upload.wikimedia.org/wikipedia/commons/2/24/Blue_square_JPEG_example.jpg", "JPEG"),
        testImage("https://upload.wikimedia.org/wikipedia/commons/f/fd/Ghostscript_Tiger.svg", "SVG"),
        testImage("https://www.gstatic.com/webp/gallery/1.webp", "WebP"),
        testImage("https://file-examples.com/wp-content/uploads/2017/10/file_example_JPG_1MB.jpg", "JPG"),
        testImage("https://www.fileformat.info/format/jp2/sample/fd6f37d6a86143c8abf9e0dc66c597c4.jp2", "JPEG2000")
      ]);

      const blocked = results.filter(r => !r.success).map(r => r.label);
      log(`<hr>Blocked formats: ${blocked.length ? blocked.join(', ') : 'None 🎉'}`);
    })();
  </script>
</body>
</html>
