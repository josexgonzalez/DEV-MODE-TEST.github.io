<!DOCTYPE html>
<html>
<head><title>PoC: Buffer Overflow</title></head>
<body>
  <h1>PoC: Buffer Overflow</h1>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    let buffer = [];
    let targetBuffer = [];

    // Functión para llenar el buffer con datos y causarle un desbordamiento
    function fillBuffer() {
      for (let i = 0; i < 10000; i++) {
        buffer.push(i); // Llenamos con valores que nos ayudarán a sobrepasar límites
      }
    }

    // Función para intentar escribir fuera de los límites del buffer
    function overflow() {
      for (let i = 0; i < 100; i++) {
        targetBuffer[i] = 13.37; // Intentamos escribir fuera de los límites
      }
    }

    // Llamamos a las funciones
    fillBuffer();
    overflow();

    // Escaneo de memoria para detectar cambios
    log("=== Escaneo de Buffer ===");
    for (let i = 0; i < targetBuffer.length; i++) {
      log(`targetBuffer[${i}] = ${targetBuffer[i]}`);
    }
  </script>
</body>
</html>
