<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Proxy + RegExp</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 2em; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>Test WebKit: Proxy + RegExp Replace</h1>
  <pre id="debug">Ejecutando prueba...</pre>

  <script>
    const log = msg => document.getElementById("debug").textContent += `\n${msg}`;

    try {
      let triggered = false;
      const victim = { toString: () => "vulnerable?" };

      const proxy = new Proxy(victim, {
        get(target, prop, receiver) {
          if (prop === "toString") {
            triggered = true;
            log("⚠️ Se accedió a toString dentro del Proxy durante .replace()");
          }
          return Reflect.get(target, prop, receiver);
        }
      });

      const result = "A".replace(/A/, proxy);

      log(`Resultado del replace: ${result}`);
      if (triggered) {
        log("⚠️ COMPORTAMIENTO SOSPECHOSO DETECTADO: El proxy fue activado.");
      } else {
        log("❌ No se activó el proxy. Parece seguro.");
      }
    } catch (e) {
      log("❌ Error durante la prueba:");
      log(e.toString());
    }
  </script>
</body>
</html>
