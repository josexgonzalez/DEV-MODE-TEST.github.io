<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>createImageBitmap Fallback Test</title>
  <style>
    body { background: black; color: lime; font-family: monospace; }
    #log { white-space: pre-wrap; padding: 1em; }
  </style>
</head>
<body>
  <h1>Fallback createImageBitmap Test</h1>
  <div id="log">Running...</div>
  <canvas id="c" width="64" height="64" style="display:none;"></canvas>
  <script>
    const log = msg => document.getElementById("log").textContent += "\n" + msg;

    async function run() {
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "red";
      ctx.fillRect(0, 0, 64, 64);

      let bitmaps = [];
      for (let i = 0; i < 10000; i++) {
        try {
          let bmp = await createImageBitmap(canvas);
          bitmaps.push(bmp);
          if (i % 100 === 0) log(`[+] Allocated ${i} bitmaps`);
        } catch (e) {
          log(`[-] Exception at ${i}: ${e}`);
          break;
        }

        if (i % 200 === 0) {
          bitmaps = []; // clear refs
          await new Promise(r => setTimeout(r, 10));
        }
      }

      log("[+] Done.");
    }

    run();
  </script>
</body>
</html>
