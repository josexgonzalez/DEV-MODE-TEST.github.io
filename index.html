<!DOCTYPE html>
<html>
<head>
  <title>Multi-Iframe WebKit Stress Test</title>
  <style>
    body {
      background: black;
      color: #0f0;
      font-family: monospace;
    }
    #log {
      white-space: pre;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #0f0;
      padding: 10px;
      margin-bottom: 20px;
    }
    iframe {
      width: 0;
      height: 0;
      border: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="log">[+] Starting multi-iframe stress test...</div>

  <script>
    const log = msg => {
      const el = document.getElementById("log");
      el.textContent += msg + "\n";
      el.scrollTop = el.scrollHeight;
    };

    const NUM_IFRAMES = 6; // Empieza con 6, luego puedes aumentar

    const iframeCode = `
      <!DOCTYPE html>
      <html>
      <body style="background: black; color: #0f0; font-family: monospace;">
        <script>
          window.onerror = function(message, source, lineno, colno, error) {
            parent.postMessage({ type: 'iframe-error', message, source, lineno, colno, error: error ? error.toString() : null }, "*");
          };

          let frame = 0;

          function createShadowNode(id) {
            const host = document.createElement("div");
            host.id = "host_" + id;
            document.body.appendChild(host);

            const shadow = host.attachShadow({ mode: "open" });

            const wrapper = document.createElement("div");
            wrapper.style.display = "contents";

            for (let i = 0; i < 20; i++) {
              const span = document.createElement("span");
              span.textContent = "FZ" + id + "-" + i;
              wrapper.appendChild(span);
            }

            shadow.appendChild(wrapper);
            getComputedStyle(wrapper).color;

            if (Math.random() < 0.5) wrapper.innerHTML = "";
            if (Math.random() < 0.3) host.remove();
            if (Math.random() < 0.1) document.body.innerHTML = "";

            if (typeof gc === "function") gc();
          }

          function fuzzLoop() {
            for (let i = 0; i < 50; i++) {
              createShadowNode(frame + "_" + i);
            }
            frame++;
            requestAnimationFrame(fuzzLoop);
          }

          new MutationObserver(() => {
            if (Math.random() < 0.4)
              document.body.innerHTML = "";
          }).observe(document.body, { childList: true, subtree: true });

          // Enviar pings a la ventana padre para monitorizar
          setInterval(() => {
            parent.postMessage({ type: "ping" }, "*");
          }, 1000);

          setTimeout(() => requestAnimationFrame(fuzzLoop), 100);
        <\/script>
      </body>
      </html>
    `;

    let iframeResponses = new Array(NUM_IFRAMES).fill(false);

    function createIframe(i) {
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
      document.body.appendChild(iframe);
      iframe.contentDocument.open();
      iframe.contentDocument.write(iframeCode);
      iframe.contentDocument.close();
      log("[+] Iframe " + i + " injected");
      return iframe;
    }

    const iframes = [];
    for (let i = 0; i < NUM_IFRAMES; i++) {
      iframes.push(createIframe(i));
    }

    // Escuchar mensajes de los iframes (ping y errores)
    window.addEventListener("message", e => {
      if (!e.data) return;

      if (e.data.type === "ping") {
        // marcar que algún iframe respondió (simplificado)
        for (let i = 0; i < iframeResponses.length; i++) {
          iframeResponses[i] = true;
        }
      } else if (e.data.type === "iframe-error") {
        log(`[!] Iframe error: ${e.data.message} at ${e.data.source}:${e.data.lineno}:${e.data.colno}`);
      }
    });

    // Monitor simple para detectar cuelgues
    setInterval(() => {
      for(let i = 0; i < iframeResponses.length; i++) {
        if (!iframeResponses[i]) {
          log(`[!] No response from iframe ${i}, possible freeze/crash`);
        }
        iframeResponses[i] = false; // reset para la siguiente ronda
      }
    }, 3000);

  </script>
</body>
</html>
