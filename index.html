<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Prueba FileReader en PS5</title>
<style>
  body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
</style>
</head>
<body>
<h1>Prueba de FileReader en PS5</h1>
<div id="resultado"></div>

<script>
  const resultado = document.getElementById('resultado');

  if (typeof FileReader !== 'undefined') {
    resultado.textContent = 'FileReader está presente en este navegador.';
  } else {
    resultado.textContent = 'FileReader NO está presente en este navegador.';
  }
</script>
</body>
</html>
