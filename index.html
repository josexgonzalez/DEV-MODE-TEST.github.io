<!DOCTYPE html>
<html>
<head>
  <title>WebKit Fuzzer with Shadow DOM</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
    }
    #log {
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="log">[+] Starting Shadow DOM fuzzer...</div>

  <script>
    const log = (msg) => {
      const el = document.getElementById("log");
      el.textContent += msg + "\n";
    };

    let frame = 0;
    const maxNodes = 500;

    function createShadowNode(id) {
      let host = document.createElement("div");
      host.id = "host_" + id;
      document.body.appendChild(host);

      let shadow = host.attachShadow({ mode: "open" });

      let wrapper = document.createElement("div");
      wrapper.style.display = "contents";

      for (let i = 0; i < 10; i++) {
        let span = document.createElement("span");
        span.textContent = `SHADOW${id}-${i}`;
        wrapper.appendChild(span);
      }

      shadow.appendChild(wrapper);

      // Force layout
      getComputedStyle(wrapper).color;

      // Mutate
      if (Math.random() < 0.3) {
        wrapper.innerHTML = ""; // sudden destruction
      }

      if (Math.random() < 0.2) {
        host.remove(); // shadow host removal
      }

      if (Math.random() < 0.1) {
        document.body.innerHTML = "<div id='log'>[+] DOM wiped</div>";
      }
    }

    function fuzzLoop() {
      if (frame % 10 === 0) log(`[+] Frame ${frame}`);

      for (let i = 0; i < 20; i++) {
        createShadowNode(frame + "_" + i);
      }

      if (window.gc) window.gc();

      frame++;
      requestAnimationFrame(fuzzLoop);
    }

    const observer = new MutationObserver(() => {
      if (Math.random() < 0.3) {
        document.body.innerHTML = "<div id='log'>[+] Mutated by observer</div>";
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });

    // Start fuzzing after 1s delay
    setTimeout(() => {
      requestAnimationFrame(fuzzLoop);
    }, 1000);
  </script>
</body>
</html>
