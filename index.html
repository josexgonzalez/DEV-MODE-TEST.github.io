<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Skia RP SkSL Detection</title>
  <style>
    canvas {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h2>Skia RP SkSL PoC</h2>
  <canvas id="testCanvas" width="256" height="256"></canvas>
  <pre id="log"></pre>

  <script>
    const log = (...args) => {
      document.getElementById("log").textContent += args.join(' ') + '\n';
      console.log(...args);
    };

    const canvas = document.getElementById("testCanvas");
    const gl = canvas.getContext("webgl");

    if (!gl) {
      log("WebGL no disponible.");
    } else {
      log("WebGL detectado. Probando shaders...");

      // Shader con operaciones que pueden dar pistas si se compila con SkSL RP
      const fragShaderSource = `
        precision mediump float;
        void main() {
          // Operación con posible overflow
          float a = 1e10;
          float b = 1e10;
          float c = a * b;
          if (c < 0.0) {
            gl_FragColor = vec4(1, 0, 0, 1); // rojo si overflow
          } else {
            gl_FragColor = vec4(0, 1, 0, 1); // verde si no
          }
        }
      `;

      const vertShaderSource = `
        attribute vec2 position;
        void main() {
          gl_Position = vec4(position, 0, 1);
        }
      `;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          log("Error compilando shader:", gl.getShaderInfoLog(shader));
          return null;
        }
        return shader;
      }

      const vertShader = compileShader(gl.VERTEX_SHADER, vertShaderSource);
      const fragShader = compileShader(gl.FRAGMENT_SHADER, fragShaderSource);

      if (!vertShader || !fragShader) {
        log("Falló la compilación de shaders.");
      } else {
        const program = gl.createProgram();
        gl.attachShader(program, vertShader);
        gl.attachShader(program, fragShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          log("Error enlazando programa:", gl.getProgramInfoLog(program));
        } else {
          log("Shaders enlazados correctamente.");
          const positionLocation = gl.getAttribLocation(program, "position");
          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1,
             1, -1,
            -1,  1,
             1,  1
          ]), gl.STATIC_DRAW);

          gl.useProgram(program);
          gl.enableVertexAttribArray(positionLocation);
          gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

          log("Shader ejecutado. Revisa si el canvas es ROJO (overflow detectado en SkSL RP) o VERDE.");
        }
      }
    }
  </script>
</body>
</html>
