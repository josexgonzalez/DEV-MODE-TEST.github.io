<!DOCTYPE html>
<html>
<head><title>ROP Chain PoC</title></head>
<body>
  <h1>ROP Chain PoC</h1>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    // Simulando una cadena ROP simple
    let buffer = [];
    let ropChain = [];

    // Vamos a suponer que estos son gadgets encontrados
    const gadget1 = 0xdeadbeef;  // Dirección de un gadget que prepara los registros
    const gadget2 = 0xdeadbeef + 0x10;  // Dirección de un gadget que ejecuta una syscall

    // Añadimos los gadgets a la cadena ROP
    ropChain.push(gadget1);  // Preparamos los registros
    ropChain.push(gadget2);  // Ejecutamos una syscall

    // Simulamos la ejecución de la ROP chain (escribir en la memoria de destino)
    function executeROPChain() {
      for (let i = 0; i < ropChain.length; i++) {
        buffer.push(ropChain[i]); // Añadimos la dirección del gadget
      }
    }

    // Ejecutamos la ROP chain
    executeROPChain();

    // Ver el resultado de la ejecución
    log("=== Resultado de la ROP Chain ===");
    log("Buffer con direcciones de gadgets:");
    for (let i = 0; i < buffer.length; i++) {
      log(`buffer[${i}] = 0x${buffer[i].toString(16)}`);
    }
  </script>
</body>
</html>
