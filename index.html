<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Skia RP SkSL Detection via Canvas 2D</title>
  <style>
    canvas {
      border: 1px solid #000;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <h3>Canvas 2D - Skia RP SkSL Detection</h3>
  <canvas id="canvas" width="512" height="512"></canvas>
  <pre id="log"></pre>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const log = (...msg) => {
      document.getElementById("log").textContent += msg.join(" ") + "\n";
    };

    // Dibujo que a veces provoca glitches en Skia con bugs antiguos
    function drawWeirdPattern() {
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0f0";
      for (let i = 0; i < 1000; i++) {
        let x = Math.sin(i * 999999) * 5000;
        let y = Math.cos(i * 888888) * 5000;
        ctx.fillRect(x % 512, y % 512, 1, 1); // muchos píxeles fuera del viewport
      }

      ctx.globalCompositeOperation = "xor";
      ctx.beginPath();
      ctx.arc(256, 256, 200, 0, 2 * Math.PI);
      ctx.fill();

      log("Canvas dibujado. Observa artefactos, fallos de clipping o glitches.");
    }

    drawWeirdPattern();
  </script>
</body>
</html>
