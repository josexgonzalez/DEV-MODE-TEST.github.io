                // Simulación de ejecución de syscall con ROP
                console.log("Ejecutando syscall con número:", ${targetSyscall});
            `;

            eval(syscall);  // Ejecutar la syscall simulada
        }

        // Función para ejecutar la cadena ROP
        function ropChain() {
            const gadgets = [

                0xcafebabe,  // Otra dirección ficticia de un gadget
                0x12345678,  // Otra dirección ficticia

            // Crear la ROP chain con gadgets
            const ropPayload = gadgets.map(gadget => {
                return `
                    // Cargar dirección de gadget en el registro
                    console.log("Ejecutando gadget ROP en:", ${gadget});

            }).join("\n");
