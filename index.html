<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS5 Proxy Fuzzing</title>
    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        #log {
            white-space: pre-wrap;
            font-size: 14px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .ok { color: #0f0; }
        .fail { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>PS5 Proxy Fuzzing Test</h1>
    <div id="log"></div>

    <script>
    (function() {
        const logElement = document.getElementById('log');

        function logOk(message) {
            const el = document.createElement('div');
            el.textContent = "[OK] " + message;
            el.className = "ok";
            logElement.appendChild(el);
        }
        function logFail(message) {
            const el = document.createElement('div');
            el.textContent = "[FAIL] " + message;
            el.className = "fail";
            logElement.appendChild(el);
        }
        function logInfo(message) {
            const el = document.createElement('div');
            el.textContent = "[INFO] " + message;
            el.className = "info";
            logElement.appendChild(el);
        }

        function randomBool() {
            return Math.random() < 0.5;
        }

        async function runProxyFuzzing() {
            logInfo("\nStarting focused Proxy Fuzzing...\n");

            const templates = [
                (obj) => `with(obj) { return this; }`,
                (obj) => `(function() { return this; }).call(obj)`,
                (obj) => `(() => this).call(obj)`,
                (obj) => `new Function("return this").call(obj)`,
                (obj) => `eval("this")`,
                (obj) => `with(obj) { a = 1; return a; }` // Check 'has'
            ];

            const proxyHandlers = [
                {
                    get: (target, prop) => Reflect.get(target, prop),
                    has: () => true,
                    set: (target, prop, value) => { target[prop] = value; return true; }
                },
                {
                    get: (target, prop) => Reflect.get(target, prop),
                    has: () => false,
                    set: (target, prop, value) => { target[prop] = value; return true; }
                },
                {
                    get: (target, prop) => {
                        logInfo(`Intercepted get: ${prop}`);
                        return Reflect.get(target, prop);
                    },
                    has: (target, prop) => {
                        logInfo(`Intercepted has: ${prop}`);
                        return true;
                    },
                    set: (target, prop, value) => { target[prop] = value; return true; }
                }

            ];

            for (let i = 0; i < 100; i++) { // Increased iterations
                let obj = {};
                let handler = proxyHandlers[Math.floor(Math.random() * proxyHandlers.length)];
                let proxyObj = new Proxy(obj, handler);

                try {
                    const code = templates[Math.floor(Math.random() * templates.length)](proxyObj);
                    const result = (new Function("obj", `return ${code};`))(proxyObj);

                    if (code.includes("a = 1") && handler.has()) {
                      // Check if 'a' is actually defined in the object
                      if (obj.a !== 1) {
                        throw new Error("Proxy 'has' bypassed!");
                      }
                    }


                    if (result !== proxyObj && result !== globalThis && result !== undefined) {
                        throw new Error(`Unexpected 'this' value! Result: ${result}`);
                    }

                    logOk(`Proxy Fuzz ${i}: OK`);
                } catch (e) {
                    logFail(`Proxy Fuzz ${i}: ${e.message}`);
                }
            }
        }

        async function main() {
            await runProxyFuzzing();
            logElement.innerHTML += "\n\n[Finished]";
        }

        main();
    })();
    </script>
</body>
</html>
