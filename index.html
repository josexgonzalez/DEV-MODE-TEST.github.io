<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Corromper XMLHttpRequest</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 2em; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>Corromper XMLHttpRequest con Proxy</h1>
  <pre id="debug">Ejecutando ataque...</pre>

  <script>
    const log = msg => document.getElementById("debug").textContent += `\n${msg}`;

    function addrof(obj) {
      const handler = {
        get(target, prop) {
          if (prop === "toString") {
            return function() {
              return String(target);
            };
          }
          return Reflect.get(target, prop);
        }
      };
      const proxy = new Proxy(obj, handler);
      return proxy.toString();
    }

    function fakeobj(address) {
      const fakeObject = {};
      const handler = {
        get(target, prop) {
          if (prop === "toString") {
            return function() {
              return `Fake object at address ${address}`;
            };
          }
          return Reflect.get(target, prop);
        }
      };
      return new Proxy(fakeObject, handler);
    }

    function write64(address, value) {
      const fakeObject = fakeobj(address);
      fakeObject.toString = function() {
        return `Written value: ${value} at address ${address}`;
      };
    }

    // Corrupting XMLHttpRequest function
    log("Intentando corromper la función 'XMLHttpRequest'...");
    const xhrAddress = addrof(XMLHttpRequest);
    log(`Dirección de 'XMLHttpRequest': ${xhrAddress}`);

    const fakeCode = function() {
      log("Código arbitrario ejecutado: ¡Hola desde el exploit!");
    };

    // Sobrescribimos 'XMLHttpRequest' con nuestra función
    write64(xhrAddress, addrof(fakeCode));
    log("Función 'XMLHttpRequest' corrompida.");

    // Intentamos realizar una petición HTTP que ahora debería ejecutar código arbitrario
    const xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://example.com');
    xhr.send();
  </script>
</body>
</html>
