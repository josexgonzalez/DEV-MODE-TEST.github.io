<!DOCTYPE html>
<html>
<head>
  <title>WebKit Fuzzer</title>
  <style>
    body {
      background: black;
      color: #0f0;
      font-family: monospace;
    }
    #log {
      white-space: pre-wrap;
      font-size: 14px;
      padding: 1em;
    }
    iframe {
      display: none;
    }
  </style>
</head>
<body>
  <div id="log">[+] Starting aggressive WebKit fuzzer...</div>

  <script>
    const log = msg => {
      const el = document.getElementById("log");
      el.textContent += msg + "\n";
      el.scrollTop = el.scrollHeight;
    };

    const iframePayload = `
<!DOCTYPE html>
<html>
  <body style='background:black; color:#0f0; font-family:monospace;'>
    <script>
      let frame = 0;
      function fillDOM() {
        for (let i = 0; i < 500; i++) {
          const d = document.createElement("div");
          d.textContent = "FZ_" + frame + "_" + i;
          const s = d.attachShadow({ mode: "open" });
          for (let j = 0; j < 100; j++) {
            const span = document.createElement("span");
            span.textContent = "X" + j;
            s.appendChild(span);
          }
          document.body.appendChild(d);
        }

        if (Math.random() < 0.3) document.body.innerHTML = "";
        if (typeof gc === "function") gc();
      }

      function loop() {
        fillDOM();
        frame++;
        setTimeout(loop, 50);
      }

      new MutationObserver(() => {
        if (Math.random() < 0.4) document.body.innerHTML = "";
      }).observe(document.body, { childList: true, subtree: true });

      loop();
    <\/script>
  </body>
</html>
`.trim();

    const TOTAL_IFRAMES = 40;
    let count = 0;

    function injectNext() {
      if (count >= TOTAL_IFRAMES) return;
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-scripts");
      iframe.srcdoc = iframePayload;
      document.body.appendChild(iframe);
      log("[+] Iframe " + count + " injected");
      count++;
      setTimeout(injectNext, 300); // uno cada 300ms
    }

    injectNext();
  </script>
</body>
</html>
