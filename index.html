<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>createImageBitmap Stress Test</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      padding: 10px;
    }
    #log {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>createImageBitmap Stress Test</h1>
  <div id="log">Running...</div>
  <script>
    const log = msg => document.getElementById("log").textContent += "\n" + msg;

    async function stressTest() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'red';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const iterations = 1000;
      let bitmaps = [];

      for (let i = 0; i < iterations; i++) {
        try {
          const bitmap = await createImageBitmap(canvas);
          bitmaps.push(bitmap);
          if (i % 100 === 0) {
            log(`[+] Created ${i} bitmaps`);
          }
        } catch (e) {
          log(`[-] Exception at iteration ${i}: ${e}`);
          break;
        }
      }

      log("[+] Stress test completed");
    }

    stressTest();
  </script>
</body>
</html>
