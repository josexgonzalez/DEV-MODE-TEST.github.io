<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PoC Compatibilidad - ScopeInfo/Primitivas</title>
  <style>
    body { background-color: #000; color: #0f0; font-family: monospace; padding: 20px; }
    h1 { color: cyan; }
  </style>
</head>
<body>
  <h1>Prueba de Compatibilidad - Scope Confusion / RW Primitives</h1>
  <pre id="log">Iniciando pruebas...</pre>

  <script>
    const log = msg => document.getElementById("log").textContent += msg + "\n";

    try {
      // Comprobación básica de motor
      const engine = navigator.userAgent;
      log("🧠 Motor detectado: " + engine);

      // Primitiva Float ↔ Int (requisito base)
      const f64 = new Float64Array(1);
      const u32 = new Uint32Array(f64.buffer);
      f64[0] = 13.37;
      log(`✅ Float64 ↔ Uint32: [${u32[0].toString(16)}, ${u32[1].toString(16)}]`);

      // Verificación de acceso a propiedades internas de funciones
      function test_func(x) { return x + 1; }
      const src = test_func.toString();
      log("📜 test_func.toString(): " + src);

      // Verificación de posibles proxies para scope confusion
      const handler = {
        get(target, prop, receiver) {
          log(`⚠️ Acceso a propiedad interceptada: ${prop}`);
          return Reflect.get(target, prop, receiver);
        }
      };
      const obj = new Proxy({value: 42}, handler);
      log("✅ Proxy construido correctamente");

      // WebAssembly minimal
      if (typeof WebAssembly === "object") {
        const wasm_code = new Uint8Array([
          0x00, 0x61, 0x73, 0x6d, // "\0asm"
          0x01, 0x00, 0x00, 0x00
        ]);
        WebAssembly.compile(wasm_code).then(() => {
          log("✅ WebAssembly: Módulo compilado");
        }).catch(e => {
          log("❌ WebAssembly: Fallo - " + e);
        });
      } else {
        log("❌ WebAssembly: No disponible");
      }

    } catch (err) {
      log("❌ Error: " + err);
    }
  </script>
</body>
</html>
