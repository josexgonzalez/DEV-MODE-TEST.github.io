<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar WebAssembly Básico</title>
</head>
<body>
    <h1>Verificación de WebAssembly</h1>
    <p id="result">Comprobando...</p>

    <script>
        if (typeof WebAssembly === "object" && typeof WebAssembly.instantiate === "function") {
            document.getElementById("result").textContent = "WebAssembly está soportado en este entorno.";
        } else {
            document.getElementById("result").textContent = "WebAssembly no está soportado en este entorno.";
        }
    </script>
</body>
</html>
