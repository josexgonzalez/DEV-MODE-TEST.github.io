<!DOCTYPE html>
<html>
<head><title>API Check</title></head>
<body style="background:black;color:lime;font-family:monospace;">
  <h1>WebKit API Detection</h1>
  <pre id="output"></pre>

  <script>
    const out = document.getElementById("output");

    function log(s) {
      out.textContent += s + "\n";
    }

    log("Navigator userAgent:\n" + navigator.userAgent + "\n");

    log("createImageBitmap: " + (typeof createImageBitmap !== "undefined"));
    log("OffscreenCanvas: " + (typeof OffscreenCanvas !== "undefined"));
    log("SharedArrayBuffer: " + (typeof SharedArrayBuffer !== "undefined"));
    log("WebGLRenderingContext: " + (typeof WebGLRenderingContext !== "undefined"));
    log("wasm: " + (typeof WebAssembly !== "undefined"));
    log("AudioContext: " + (typeof AudioContext !== "undefined"));
    log("MessageChannel: " + (typeof MessageChannel !== "undefined"));

    try {
      let canvas = document.createElement("canvas");
      let gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
      log("WebGL context: " + (gl ? "YES" : "NO"));
    } catch (e) {
      log("WebGL context: NO (" + e.message + ")");
    }
  </script>
</body>
</html>
